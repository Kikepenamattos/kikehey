<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 4 - Team Docu</title>
    <link rel="stylesheet" href="../design-system/tokens/index.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            background-color: var(--color-surface-regular, #ffffff);
            color: var(--color-text-primary, #0a243f);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .team-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .team-header {
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 2px solid var(--color-basics-gray, #e0e0e0);
        }

        .team-title {
            font-family: 'Crimson Pro', serif;
            font-size: 48px;
            font-weight: 800;
            color: var(--color-text-primary, #0a243f);
            margin-bottom: 16px;
        }

        .team-meta {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 12px;
            color: var(--color-text-secondary, #6b7b8a);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-primary, #0a243f);
        }

        .team-section {
            margin-top: 48px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text-primary, #0a243f);
            margin-bottom: 24px;
        }

        .team-members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .team-member-card {
            background: var(--color-surface-regular, #ffffff);
            border: 1px solid var(--color-basics-gray, #e0e0e0);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .member-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-text-primary, #0a243f);
            margin-bottom: 4px;
        }

        .member-job {
            font-size: 14px;
            color: var(--color-text-secondary, #6b7b8a);
            margin-bottom: 16px;
        }

        .member-contact {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--color-text-primary, #0a243f);
        }

        .contact-item img {
            width: 16px;
            height: 16px;
        }

        .member-cost {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--color-basics-gray, #e0e0e0);
        }

        .cost-label {
            font-size: 12px;
            color: var(--color-text-secondary, #6b7b8a);
        }

        .cost-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-primary, #0a243f);
        }

        .projects-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .project-chip {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--color-surface-especial, #f5f5f5);
            border: 1px solid var(--color-basics-gray, #e0e0e0);
            border-radius: 20px;
            font-size: 14px;
            color: var(--color-text-primary, #0a243f);
        }

        .no-members,
        .no-projects {
            color: var(--color-text-secondary, #6b7b8a);
            font-style: italic;
        }

        @media (max-width: 768px) {
            .team-title {
                font-size: 32px;
            }

            .team-members-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="team-container">
        <div class="team-header">
            <h1 class="team-title">Proyecto 4</h1>
            <div class="team-meta">
                <div class="meta-item">
                    <span class="meta-label">Team Cost</span>
                    <span class="meta-value">USD 0.00</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Members</span>
                    <span class="meta-value">0</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Published</span>
                    <span class="meta-value">1 de noviembre de 2025</span>
                </div>
            </div>
        </div>

        

        <div class="team-section">
            <h2 class="section-title">Team Members</h2>
            <div class="team-members-grid">
                <p class="no-members">No hay miembros en este team.</p>
            </div>
        </div>
    </div>
</body>
</html>
