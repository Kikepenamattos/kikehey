<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docu - Iniciar Sesión</title>
    
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Scripts de autenticación -->
    <script src="js/auth.js"></script>
    <script src="js/project-data.js"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Logo -->
            <div class="logo">
                <img src="images/logo.svg" alt="Logo Docu" class="logo-img">
            </div>

            <!-- Texto de bienvenida -->
            <div class="welcome-text">
                <h1>Easy projects, easy management.</h1>
                <p>Create and manage projects as never before; with simple clicks, great results.</p>
            </div>

            <!-- Formulario de login -->
            <form class="login-form" id="loginForm">
                <!-- Input Email -->
                <div class="form-group">
                    <div class="input-label-row">
                        <label for="email" class="input-label">
                            Email adress
                            <img src="images/asterisk.svg" alt="Required" class="asterisk-icon">
                        </label>
                    </div>
                    <div class="input-container">
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="email@email.com"
                            required
                        >
                    </div>
                </div>

                <!-- Input Password -->
                <div class="form-group">
                    <div class="input-label-row">
                        <label for="password" class="input-label">
                            Password
                            <img src="images/asterisk.svg" alt="Required" class="asterisk-icon">
                        </label>
                    </div>
                    <div class="input-container input-container--with-icon">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="12345"
                            required
                        >
                        <span class="input-container__icon" id="passwordToggle" aria-label="Toggle password visibility">
                            <img src="images/eye_hidden.svg" alt="Password is hidden - Click to show" class="eye-icon" id="eyeIcon">
                        </span>
                    </div>
                </div>

                <!-- Botón Log in -->
                <button type="submit" class="login-button">
                    <span>Log in</span>
                    <img src="images/right-chevron.svg" alt="Right chevron" class="right-chevron-icon">
                </button>
            </form>

            <!-- Enlace de registro -->
            <div class="signup-link">
                <span>¿</span>No account<span>? </span>
                <a href="#" id="signupLink">Create an account</a>
            </div>

            <!-- Botón de Google -->
            <button class="google-button" id="googleButton">
                <img src="images/Google.svg" alt="Google" class="google-icon">
                <span>Continue with Google</span>
            </button>

            <!-- Ilustración del barco -->
            <div class="illustration">
                <img src="images/barco_vector.svg" alt="Ilustración del barco" class="boat-illustration-img">
            </div>
        </div>
    </div>

    <script>
        class LoginManager {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.emailInput = document.getElementById('email');
                this.passwordInput = document.getElementById('password');
                this.passwordToggle = document.getElementById('passwordToggle');
                this.googleButton = document.getElementById('googleButton');
                this.signupLink = document.getElementById('signupLink');
                
                this.init();
            }

            init() {
                this.bindEvents();
                this.setupPasswordToggle();
            }

            bindEvents() {
                this.form.addEventListener('submit', (e) => this.handleLogin(e));
                this.googleButton.addEventListener('click', () => this.handleGoogleLogin());
                this.signupLink.addEventListener('click', (e) => this.handleSignup(e));
            }

            setupPasswordToggle() {
                const eyeIcon = document.getElementById('eyeIcon');
                if (!eyeIcon || !this.passwordToggle) return;
                
                // Función para actualizar el icono según el estado actual del texto
                // eye.svg → texto VISIBLE (muestra el texto)
                // eye_hidden.svg → texto OCULTO (oculta el texto)
                const updateIcon = () => {
                    const isPassword = this.passwordInput.type === 'password';
                    
                    if (isPassword) {
                        // Texto está OCULTO → mostrar eye_hidden.svg
                        eyeIcon.src = 'images/eye_hidden.svg';
                        eyeIcon.alt = 'Password is hidden - Click to show';
                    } else {
                        // Texto está VISIBLE → mostrar eye.svg
                        eyeIcon.src = 'images/eye.svg';
                        eyeIcon.alt = 'Password is visible - Click to hide';
                    }
                };
                
                // Inicializar el icono según el estado actual (inicialmente está oculto)
                updateIcon();
                
                // Event listener para toggle
                this.passwordToggle.addEventListener('click', () => {
                    // Cambiar el tipo del input
                    const currentType = this.passwordInput.type;
                    const newType = currentType === 'password' ? 'text' : 'password';
                    this.passwordInput.type = newType;
                    
                    // Actualizar el icono después del cambio
                    updateIcon();
                });
            }

            handleLogin(e) {
                e.preventDefault();
                
                const email = this.emailInput.value.trim();
                const password = this.passwordInput.value.trim();
                
                if (!email || !password) {
                    alert('Por favor completa todos los campos');
                    return;
                }
                
                this.showLoading();
                
                // Esperar a que DocuAuth esté disponible
                const attemptLogin = () => {
                    if (typeof window.DocuAuth === 'undefined') {
                        setTimeout(attemptLogin, 100);
                        return;
                    }
                    
                    // Intentar autenticar
                    const session = DocuAuth.authenticate(email, password);
                    
                    if (session) {
                        // Guardar email para futuras sesiones
                        DocuAuth.saveLoginEmail(email);
                        
                        // Redirigir según la lógica: proyectos → teams → create_team.html
                        // Aumentar el tiempo de espera para asegurar que los datos estén disponibles
                        setTimeout(() => {
                            redirectAfterLogin();
                        }, 800);
                    } else {
                        alert('Credenciales inválidas. Por favor verifica tu email y contraseña.');
                        this.form.querySelector('.login-button').disabled = false;
                        this.form.querySelector('.login-button').style.opacity = '1';
                        this.form.querySelector('.login-button').innerHTML = '<span>Log in</span><img src="images/right-chevron.svg" alt="Right chevron" class="right-chevron-icon">';
                    }
                };
                
                attemptLogin();
            }

            handleGoogleLogin() {
                this.showLoading();
                // Aquí implementarías la autenticación real con Google
                setTimeout(() => {
                    alert('¡Login con Google exitoso! Redirigiendo al dashboard...');
                    // window.location.href = 'dashboard.html'; // Cuando creemos el dashboard
                }, 1500);
            }

            handleSignup(e) {
                e.preventDefault();
                // Redirigir a la página de registro
                window.location.href = 'sign_up.html';
            }

            showLoading() {
                const button = this.form.querySelector('.login-button');
                const originalText = button.innerHTML;
                
                button.innerHTML = 'Iniciando sesión...';
                button.disabled = true;
                button.style.opacity = '0.7';
                
                // Restaurar después de un tiempo
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                    button.style.opacity = '1';
                }, 2000);
            }
        }

        // Función helper para redirigir después del login según la lógica:
        // 1. Si tiene proyectos → último proyecto creado
        // 2. Si NO tiene proyectos pero tiene teams → último team creado
        // 3. Si NO tiene ni teams ni proyectos → create_team.html
        function redirectAfterLogin() {
            if (typeof window.DocuProjectData === 'undefined') {
                console.log('⏳ Esperando DocuProjectData...');
                setTimeout(redirectAfterLogin, 100);
                return;
            }
            
            if (typeof window.DocuAuth === 'undefined') {
                console.log('⏳ Esperando DocuAuth...');
                setTimeout(redirectAfterLogin, 100);
                return;
            }
            
            try {
                // Obtener sesión actual
                const session = DocuAuth.getCurrentSession();
                if (!session) {
                    console.error('❌ No hay sesión activa');
                    window.location.href = 'create_team.html';
                    return;
                }
                
                console.log('🔍 Obteniendo datos del usuario para redirección...');
                console.log('📧 Email de sesión:', session.email);
                
                // Obtener datos del proyecto
                const projectData = DocuProjectData.getProjectData();
                console.log('📦 Datos obtenidos de DocuProjectData:', projectData);
                
                // Verificación adicional: leer directamente de localStorage
                const directData = DocuAuth.loadProjectData(session.email);
                console.log('📦 Datos leídos directamente de localStorage:', directData);
                
                // Usar los datos más completos disponibles
                const finalData = projectData || directData;
                
                if (!finalData) {
                    console.warn('⚠️ No se encontraron datos del usuario, redirigiendo a create_team.html');
                    window.location.href = 'create_team.html';
                    return;
                }
                
                // Verificar si hay proyectos creados
                const projects = finalData.projects && Array.isArray(finalData.projects) ? finalData.projects : [];
                console.log(`📊 Total de proyectos encontrados: ${projects.length}`);
                if (projects.length > 0) {
                    console.log('📋 Lista de proyectos:', projects.map(p => ({ id: p.id, name: p.name, createdAt: p.createdAt, updatedAt: p.updatedAt })));
                }
                
                if (projects.length > 0) {
                    // Si tiene proyectos, obtener el último proyecto creado
                    const sortedProjects = [...projects].sort((a, b) => {
                        // Usar createdAt, updatedAt según disponibilidad
                        const dateA = a.createdAt || a.updatedAt || 0;
                        const dateB = b.createdAt || b.updatedAt || 0;
                        return dateB - dateA; // Más reciente primero
                    });
                    
                    const lastProject = sortedProjects[0];
                    console.log('🎯 Último proyecto encontrado:', lastProject);
                    
                    if (lastProject && lastProject.id) {
                        const redirectUrl = `project_view.html?id=${lastProject.id}`;
                        console.log(`✅ Redirigiendo al último proyecto creado: ${lastProject.name} (ID: ${lastProject.id})`);
                        window.location.href = redirectUrl;
                        return;
                    } else {
                        console.warn('⚠️ Último proyecto no tiene ID válido, verificando teams...');
                        console.warn('⚠️ Datos del proyecto:', lastProject);
                    }
                } else {
                    console.log('ℹ️ Usuario no tiene proyectos creados, verificando teams...');
                }
                
                // Si no hay proyectos, verificar teams
                const teams = finalData.teams && Array.isArray(finalData.teams) ? finalData.teams : [];
                console.log(`👥 Total de teams encontrados: ${teams.length}`);
                if (teams.length > 0) {
                    console.log('👥 Lista de teams:', teams.map(t => ({ id: t.id, name: t.name, status: t.status, createdAt: t.createdAt, updatedAt: t.updatedAt })));
                }
                
                if (teams.length > 0) {
                    // Si tiene teams, obtener el último team creado
                    const sortedTeams = [...teams].sort((a, b) => {
                        // Usar createdAt, updatedAt o publishedAt según disponibilidad
                        const dateA = a.createdAt || a.updatedAt || a.publishedAt || 0;
                        const dateB = b.createdAt || b.updatedAt || b.publishedAt || 0;
                        return dateB - dateA; // Más reciente primero
                    });
                    
                    const lastTeam = sortedTeams[0];
                    console.log('🎯 Último team encontrado:', lastTeam);
                    
                    if (lastTeam && lastTeam.id) {
                        let redirectUrl = 'create_team.html'; // Por defecto (fallback)
                        
                        // Si el team está publicado, redirigir a team_filled.html
                        if (lastTeam.status === 'published') {
                            redirectUrl = `team_filled.html?id=${lastTeam.id}`;
                            console.log(`✅ Redirigiendo al último team publicado: ${lastTeam.name} (ID: ${lastTeam.id})`);
                        } else {
                            // Si no está publicado, redirigir a create_team.html para editarlo
                            redirectUrl = `create_team.html?edit=true&id=${lastTeam.id}`;
                            console.log(`✅ Redirigiendo al último team (draft): ${lastTeam.name} (ID: ${lastTeam.id})`);
                        }
                        
                        window.location.href = redirectUrl;
                        return;
                    } else {
                        console.warn('⚠️ Último team no tiene ID válido, redirigiendo a create_team.html');
                        console.warn('⚠️ Datos del team:', lastTeam);
                    }
                } else {
                    console.log('ℹ️ Usuario no tiene teams creados, redirigiendo a create_team.html');
                }
                
                // Si no hay ni proyectos ni teams, redirigir a create_team.html
                console.log('🔄 Redirigiendo a create_team.html (sin proyectos ni teams)');
                window.location.href = 'create_team.html';
            } catch (error) {
                console.error('❌ Error al obtener datos del usuario:', error);
                console.error('❌ Stack trace:', error.stack);
                // En caso de error, redirigir a create_team.html
                window.location.href = 'create_team.html';
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si hay sesión activa
            const checkSession = () => {
                if (typeof window.DocuAuth !== 'undefined') {
                    if (DocuAuth.isAuthenticated()) {
                        // Redirigir según la lógica: proyectos → teams → create_team.html
                        redirectAfterLogin();
                        return;
                    }
                } else {
                    setTimeout(checkSession, 100);
                    return;
                }
                
                // Si no hay sesión, inicializar el login manager
                new LoginManager();
            };
            
            checkSession();
        });
    </script>
</body>
</html>
