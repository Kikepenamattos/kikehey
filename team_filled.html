        function saveProjectToStorage(projectId, projectData) {
            console.log('=== saveProjectToStorage ===');
            console.log('projectId:', projectId);
            console.log('projectData:', projectData);
            
            try {
                // Verificar que DocuProjectData esté disponible
                if (typeof DocuProjectData === 'undefined') {
                    console.error('❌ DocuProjectData no está disponible');
                    return false;
                }
                
                // Verificar que DocuAuth esté disponible
                if (typeof DocuAuth === 'undefined') {
                    console.error('❌ DocuAuth no está disponible');
                    return false;
                }
                
                // Obtener datos actuales o crear estructura vacía
                let projectDataObj = DocuProjectData.getProjectData();
                
                if (!projectDataObj) {
                    console.log('⚠️ No hay datos del proyecto, inicializando...');
                    projectDataObj = {
                        projects: [],
                        teams: [],
                        settings: {},
                        preferences: {}
                    };
                }
                
                // Asegurar que teams sea un array
                if (!projectDataObj.teams || !Array.isArray(projectDataObj.teams)) {
                    console.log('⚠️ Teams no es un array válido, inicializando...');
                    projectDataObj.teams = [];
                }

                console.log('📦 Estado actual:', {
                    totalTeams: projectDataObj.teams.length,
                    publishedTeams: projectDataObj.teams.filter(t => t.status === 'published').length
                });

                // Buscar si ya existe
                const existingIndex = projectDataObj.teams.findIndex(t => t.id === projectId);
                
                if (existingIndex >= 0) {
                    console.log('🔄 Actualizando team existente en índice:', existingIndex);
                    const existingTeam = projectDataObj.teams[existingIndex];
                    
                    // Si el team existente está publicado y el nuevo tiene status diferente, preservar el status publicado
                    if (existingTeam.status === 'published' && projectData.status !== 'published') {
                        console.log('⚠️ Team existente está publicado, preservando status publicado');
                        projectData.status = 'published';
                        // Preservar también publishedAt si existe
                        if (existingTeam.publishedAt) {
                            projectData.publishedAt = existingTeam.publishedAt;
                        }
                    }
                    
                    // Hacer merge de datos en lugar de reemplazar completamente
                    projectDataObj.teams[existingIndex] = {
                        ...existingTeam, // Preservar datos existentes
                        ...projectData,  // Actualizar con nuevos datos
                        id: projectId,   // Asegurar que el ID se mantiene
                        updatedAt: Date.now()
                    };
                    console.log('✅ Team actualizado preservando datos importantes');
                } else {
                    console.log('➕ Agregando nuevo team');
                    projectDataObj.teams.push(projectData);
                }

                console.log('📊 Total de teams después de guardar:', projectDataObj.teams.length);
                
                // Publicados: filtrar y mostrar cantidad
                const published = projectDataObj.teams.filter(t => t.status === 'published');
                console.log('📋 Teams publicados:', published.length);
                
                // Log de los teams publicados para debugging
                if (published.length > 0) {
                    console.log('📋 Lista de teams publicados:', published.map(t => ({
                        id: t.id,
                        name: t.name,
                        status: t.status
                    })));
                }

                // Guardar datos
                const saved = DocuProjectData.saveProjectData(projectDataObj);
                
                if (!saved) {
                    console.error('❌ Error al guardar en DocuProjectData');
                    return false;
                }
                
                // Verificación inmediata: leer de vuelta para confirmar persistencia
                console.log('🔍 Verificando persistencia...');
                setTimeout(() => {
                    const verifyData = DocuProjectData.getProjectData();
                    if (verifyData && verifyData.teams) {
                        const verifyTeam = verifyData.teams.find(t => t.id === projectId);
                        if (verifyTeam) {
                            console.log('✅ Verificación exitosa: team encontrado en localStorage');
                            console.log('📋 Team verificado:', {
                                id: verifyTeam.id,
                                name: verifyTeam.name,
                                status: verifyTeam.status,
                                projectsCount: verifyTeam.projects ? verifyTeam.projects.length : 0,
                                projects: verifyTeam.projects || []
                            });
                            
                            // Verificación específica de chips
                            if (verifyTeam.projects && Array.isArray(verifyTeam.projects) && verifyTeam.projects.length > 0) {
                                console.log('✅ Chips de Associated Projects verificados en localStorage:', verifyTeam.projects.length);
                            } else {
                                console.warn('⚠️ Verificación: no se encontraron chips de Associated Projects después de guardar');
                            }
                        } else {
                            console.warn('⚠️ Verificación: team no encontrado después de guardar');
                        }
                    } else {
                        console.warn('⚠️ Verificación: no se pudieron leer los datos después de guardar');
                    }
                }, 100);
                
                console.log('✅ Datos guardados exitosamente');
                return true;
            } catch (error) {
                console.error('❌ Excepción en saveProjectToStorage:', error);
                console.error('Stack:', error.stack);
                return false;
            }
        }

        function isValidEmail(email) {
            // Validación básica: debe contener @ y al menos un punto después del @
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function validateEmailField(emailInput) {
            const email = emailInput.value.trim();
            if (email && !isValidEmail(email)) {
                emailInput.style.borderColor = 'var(--color-status-strong-red)';
            } else {
                emailInput.style.borderColor = '';
            }
        }

        function formatCurrencyInput(input) {
            // Remover todo excepto números y un punto decimal
            let value = input.value.replace(/[^\d.]/g, '');
            
            // Asegurar solo un punto decimal
            const parts = value.split('.');
            if (parts.length > 2) {
                value = parts[0] + '.' + parts.slice(1).join('');
            }
            
            // Limitar a 2 decimales
            if (parts.length === 2 && parts[1].length > 2) {
                value = parts[0] + '.' + parts[1].substring(0, 2);
            }
            
            input.value = value;
        }

        function formatCurrencyOnBlur(input) {
            let value = input.value.trim();
            if (value && !isNaN(value)) {
                // Formatear con 2 decimales
                const numValue = parseFloat(value);
                if (!isNaN(numValue)) {
                    input.value = numValue.toFixed(2);
                }
            }
        }

        function createMember(memberData) {
            // Generar ID único para el miembro si no existe
            if (!memberData.id) {
                memberData.id = Date.now().toString() + '_' + Math.random().toString(36).substr(2, 9);
            }
            
            membersList.push(memberData);
            
            // Habilitar secondary-actions cuando se crea el primer miembro
            if (membersList.length === 1) {
                enableSecondaryActions();
            }
            
            // Crear tarjeta de miembro visual
            createMemberCard(memberData).catch(err => console.error('Error al crear card:', err));
            
            // Actualizar costo del equipo
            updateTeamCost();
            
            // Guardar automáticamente después de agregar miembro
            autoSave();
            
            console.log('Miembro creado:', memberData);
            console.log('Total de miembros:', membersList.length);
        }

        function updateTeamCost() {
            const teamCostInput = document.getElementById('teamCost');
            if (!teamCostInput) return;

            // Sumar todos los costos individuales de los miembros
            let totalCost = 0;
            membersList.forEach(member => {
                const cost = member.cost || '';
                if (cost) {
                    // Remover cualquier carácter no numérico excepto punto decimal
                    const numericValue = parseFloat(cost.replace(/[^\d.]/g, ''));
                    if (!isNaN(numericValue)) {
                        totalCost += numericValue;
                    }
                }
            });

            // Formatear el total en USD con 2 decimales
            if (totalCost > 0) {
                teamCostInput.value = `USD ${totalCost.toFixed(2)}`;
            } else {
                teamCostInput.value = '';
            }
        }

        // ============================================
        // Associated Projects Chips Functionality
        // ============================================
        function initAssociatedProjectsChips() {
            const associatedProjectsInput = document.getElementById('associatedProjects');
            const chipsContainer = document.getElementById('projectsChipsContainer');
            
            if (!associatedProjectsInput || !chipsContainer) return;
            
            // Crear chip al presionar Enter
            associatedProjectsInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = this.value.trim();
                    
                    if (value) {
                        // Verificar si el chip ya existe
                        const existingChips = Array.from(chipsContainer.querySelectorAll('.project-chip'));
                        const exists = existingChips.some(chip => 
                            chip.querySelector('.project-chip__text').textContent.toLowerCase() === value.toLowerCase()
                        );
                        
                        if (!exists) {
                            const chip = createProjectChip(value);
                            chipsContainer.appendChild(chip);
                            this.value = ''; // Limpiar input después de crear chip
                            // Guardar automáticamente después de agregar chip
                            autoSave();
                        } else {
                            alert('Este proyecto ya está agregado');
                        }
                    }
                }
            });
        }
        
        function createProjectChip(text) {
            const chip = document.createElement('div');
            chip.className = 'project-chip';
            chip.setAttribute('data-project', text.trim());

        // ============================================
        // Input Buscador Functionality
        // ============================================
        function initInputBuscador() {
            const searchInput = document.getElementById('searchInput');
            const sendIcon = document.getElementById('searchSendIcon');
            
            if (!searchInput || !sendIcon) return;
            
            // Activar/desactivar icono según input
            searchInput.addEventListener('input', function() {
                if (this.value.trim().length > 0) {
                    sendIcon.classList.add('dsu-input-buscador__send-icon--active');
                } else {
                    sendIcon.classList.remove('dsu-input-buscador__send-icon--active');
                }
            });
            
            // Handler para el click en el icono
            sendIcon.addEventListener('click', function() {
                const searchValue = searchInput.value.trim();
                if (searchValue) {
                    console.log('Enviar búsqueda:', searchValue);
                    // Aquí puedes agregar la lógica de búsqueda
                    performSearch(searchValue);
                }
            });
            
            // También permitir búsqueda con Enter
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchValue = this.value.trim();
                    if (searchValue) {
                        performSearch(searchValue);
                    }
                }
            });
        }
        
        function performSearch(searchQuery) {
            console.log('Realizando búsqueda:', searchQuery);
            const teamMembersGrid = document.getElementById('teamMembersGrid');
            if (!teamMembersGrid) return;
            
            const members = teamMembersGrid.querySelectorAll('.dsu-profile-card');
            const searchLower = searchQuery.toLowerCase();
            
            members.forEach(member => {
                const name = member.querySelector('.dsu-profile-card__name')?.textContent.toLowerCase() || '';
                const job = member.querySelector('.dsu-profile-card__job')?.textContent.toLowerCase() || '';
                const email = member.querySelector('.dsu-profile-card__contact-text')?.textContent.toLowerCase() || '';
                
                const isVisible = name.includes(searchLower) || job.includes(searchLower) || email.includes(searchLower);
                member.style.display = isVisible ? '' : 'none';
            });
        }

        // ============================================
        // Input Rich Text Functionality
        // Convierte inputs dsu-input--only en rich text inputs simplificados
        // ============================================
        function initInputLinkFunctionality() {
            // Encontrar todos los inputs con clase dsu-input dsu-input--only
            const inputs = document.querySelectorAll('.dsu-input.dsu-input--only');
            
            inputs.forEach(input => {
                // Verificar si ya fue convertido (evitar duplicados)
                if (input.dataset.richTextConverted === 'true') {
                    return;
                }

                // Obtener el contenedor del input
                let container = input.closest('.dsu-input-container') || input.closest('.dsu-input-buscador') || input.parentElement;
                const originalContainer = container;
                
                // Guardar valores originales
                const originalValue = input.value || '';
                const originalPlaceholder = input.placeholder || '';
                const originalId = input.id || '';
                const originalName = input.name || '';
                
                // Crear rich text input wrapper
                const richTextWrapper = document.createElement('div');
                richTextWrapper.className = 'dsu-rich-text-input dsu-rich-text-input--compact';
                richTextWrapper.dataset.inputId = originalId;
                
                // Crear toolbar simplificada (solo link)
                const toolbar = document.createElement('div');
                toolbar.className = 'dsu-rich-text-input__toolbar dsu-rich-text-input__toolbar--compact';
                toolbar.innerHTML = `
                    <button class="dsu-rich-text-input__toolbar-button" data-command="createLink" data-value="https://" title="Insertar enlace">
                        <img src="images/link.svg" alt="Link">
                    </button>
                `;
                
                // Crear editor
                const editor = document.createElement('div');
                editor.className = 'dsu-rich-text-input__editor dsu-rich-text-input__editor--compact';
                editor.contentEditable = true;
                editor.setAttribute('data-placeholder', originalPlaceholder);
                if (originalValue) {
                    editor.textContent = originalValue;
                }
                
                // Agregar elementos al wrapper
                richTextWrapper.appendChild(toolbar);
                richTextWrapper.appendChild(editor);
                
                // Reemplazar input con rich text input
                input.parentNode.insertBefore(richTextWrapper, input);
                input.style.display = 'none';
                input.dataset.richTextConverted = 'true';
                
                // Sincronizar valores entre input oculto y editor
                function syncToInput() {
                    input.value = editor.textContent;
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                    input.dispatchEvent(new Event('change', { bubbles: true }));
                }
                
                // Sincronizar desde input oculto al editor
                function syncFromInput() {
                    if (input.value !== editor.textContent) {
                        editor.textContent = input.value;
                    }
                }
                
                // Event listeners para sincronización
                editor.addEventListener('input', syncToInput);
                editor.addEventListener('blur', syncToInput);
                
                // Manejar placeholder
                function checkPlaceholder() {
                    if (editor.textContent.trim() === '') {
                        editor.classList.add('dsu-rich-text-input__editor--empty');
                    } else {
                        editor.classList.remove('dsu-rich-text-input__editor--empty');
                    }
                }
                
                editor.addEventListener('input', checkPlaceholder);
                editor.addEventListener('blur', checkPlaceholder);
                checkPlaceholder();
                
                // Inicializar toolbar usando la función existente
                const toolbarButtons = toolbar.querySelectorAll('.dsu-rich-text-input__toolbar-button[data-command]');
                
                toolbarButtons.forEach(function(button) {
                    button.addEventListener('click', function(e) {
                        e.preventDefault();
                        const command = this.getAttribute('data-command');
                        const value = this.getAttribute('data-value') || null;
                        
                        // Focus on editor before executing command
                        editor.focus();
                        
                        if (command === 'createLink') {
                            // Verificar si hay texto seleccionado
                            const selection = window.getSelection();
                            const selectedText = selection.toString().trim();
                            
                            if (!selectedText) {
                                alert('Por favor, selecciona el texto al que deseas agregar un link');
                                return;
                            }
                            
                            const url = prompt('Ingresa la URL del link:', value || 'https://');
                            if (url && url.trim()) {
                                let validUrl = url.trim();
                                if (!validUrl.startsWith('http://') && !validUrl.startsWith('https://')) {
                                    validUrl = 'https://' + validUrl;
                                }
                                document.execCommand('createLink', false, validUrl);
                                syncToInput();
                            }
                        } else {
                            document.execCommand(command, false, value);
                            syncToInput();
                        }
                    });
                });
                
                // Si el input original tenía un evento de búsqueda, mantenerlo
                if (originalId === 'searchInput') {
                    // Mantener funcionalidad de búsqueda
                    editor.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            const searchValue = editor.textContent.trim();
                            if (searchValue && typeof performSearch === 'function') {
                                performSearch(searchValue);
                            }
                        }
                    });
                }
            });
            
            // Inicializar rich text inputs convertidos
            const convertedRichTexts = document.querySelectorAll('.dsu-rich-text-input--compact');
            if (convertedRichTexts.length > 0 && typeof initRichTextToolbar === 'function') {
                // Los botones ya están inicializados arriba, pero podemos llamar a initRichTextToolbar
                // para asegurar que todo esté correcto
                setTimeout(() => {
                    initRichTextToolbar();
                }, 100);
            }
        }

                const selectedTeamId = sessionStorage.getItem('docu_selected_team_id');
                if (selectedTeamId) {
                    console.log('🔍 Team seleccionado encontrado en sessionStorage:', selectedTeamId);
                    
                    // Buscar el team en los datos
                    const selectedTeam = projectDataObj.teams.find(t => t.id === selectedTeamId);
                    if (selectedTeam) {
                        console.log('✅ Team seleccionado encontrado en datos:', selectedTeam.name || selectedTeam.id);
                        loadProjectData(selectedTeam).catch(err => console.error('Error al cargar project data:', err));
                        
                        // Marcar como activo en el sidebar
                        setTimeout(() => {
                            const teamsList = document.getElementById('teamsList');
                            if (teamsList) {
                                const teamItems = teamsList.querySelectorAll('.dsu-team-item');
                                teamItems.forEach(item => {
                                    item.classList.remove('dsu-team-item--active', 'active');
                                    const itemId = item.getAttribute('data-team-id');
                                    if (itemId === selectedTeamId) {
                                        item.classList.add('dsu-team-item--active', 'active');
                                        console.log('✅ Team seleccionado marcado como activo en el sidebar');
                                    }
                                });
                            }
                        }, 500);
                        
                        return; // Salir aquí, ya cargamos el team seleccionado
                    } else {
                        console.warn('⚠️ Team seleccionado no encontrado en datos, limpiando sessionStorage');
                        sessionStorage.removeItem('docu_selected_team_id');
                    }
                } else {
                    console.log('ℹ️ No hay team seleccionado en sessionStorage');
                }
            } catch (error) {
                console.warn('⚠️ Error al leer sessionStorage:', error);
            }

            // Si no hay team seleccionado, buscar el proyecto draft más reciente
            const drafts = projectDataObj.teams.filter(t => t.status === 'draft');
            console.log('📝 Teams en draft:', drafts.length);
            
            if (drafts.length > 0) {
                // Cargar el draft más reciente
                const latestDraft = drafts.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
                console.log('📋 Cargando draft más reciente:', latestDraft.name || latestDraft.id);
                loadProjectData(latestDraft).catch(err => console.error('Error al cargar draft:', err));
                
                // Guardar como seleccionado
                try {
                    sessionStorage.setItem('docu_selected_team_id', latestDraft.id);
                } catch (error) {
                    console.warn('⚠️ No se pudo guardar el draft seleccionado:', error);
                }
                return;
            }

            // Si no hay drafts, cargar el team publicado más reciente
            const publishedTeams = projectDataObj.teams.filter(t => 
                t.status === 'published' && 
                t.name && 
                t.name.trim().length > 0
            );
            
            console.log('📋 Teams publicados:', publishedTeams.length);
            
            if (publishedTeams.length > 0) {
                // Ordenar por fecha de publicación (más reciente primero)
                const sortedPublished = publishedTeams.sort((a, b) => {
                    const dateA = a.publishedAt || a.updatedAt || a.createdAt || 0;
                    const dateB = b.publishedAt || b.updatedAt || b.createdAt || 0;
                    return dateB - dateA;
                });
                
                const latestPublished = sortedPublished[0];
                console.log('📋 Cargando team publicado más reciente:', latestPublished.name);
                loadProjectData(latestPublished).catch(err => console.error('Error al cargar published:', err));
                
                // Guardar como seleccionado
                try {
                    sessionStorage.setItem('docu_selected_team_id', latestPublished.id);
                } catch (error) {
                    console.warn('⚠️ No se pudo guardar el team seleccionado:', error);
                }
                
                // Marcar como activo en el sidebar
                setTimeout(() => {
                    const teamsList = document.getElementById('teamsList');
                    if (teamsList) {
                        const teamItems = teamsList.querySelectorAll('.dsu-team-item');
                        teamItems.forEach(item => {
                            item.classList.remove('dsu-team-item--active', 'active');
                            const itemId = item.getAttribute('data-team-id');
                            if (itemId === latestPublished.id) {
                                item.classList.add('dsu-team-item--active', 'active');
                                console.log('✅ Team marcado como activo en el sidebar');
                            }
                        });
                    }
                }, 500);
            } else {
                console.log('ℹ️ No hay teams publicados ni drafts para cargar');
            }
        }

        async function loadProjectData(projectData) {
            if (!projectData) {
                console.warn('⚠️ loadProjectData: projectData es null o undefined');
                return;
            }

            console.log('=== loadProjectData llamado ===');
            console.log('📦 Datos del team a cargar:', {
                id: projectData.id,
                name: projectData.name,
                status: projectData.status,
                membersCount: projectData.members ? projectData.members.length : 0,
                projectsCount: projectData.projects ? projectData.projects.length : 0
            });

            currentProjectId = projectData.id || Date.now().toString();
            currentProjectData = { ...projectData }; // Crear copia para no modificar el original directamente
            
            console.log('✅ currentProjectId establecido:', currentProjectId);
            console.log('✅ currentProjectData establecido con status:', currentProjectData.status);

            // Cargar nombre del proyecto
            if (projectData.name) {
                document.getElementById('projectName').value = projectData.name;
                const publishBtn = document.getElementById('publishBtn');
                if (publishBtn) {
                    publishBtn.disabled = false;
                }
            }

            // Cargar team cost
            if (projectData.teamCost) {
                document.getElementById('teamCost').value = projectData.teamCost;
            }

            // Cargar miembros
            if (projectData.members && Array.isArray(projectData.members)) {
                membersList = projectData.members;
                
                // Recrear las tarjetas de miembros
                const teamMembersGrid = document.getElementById('teamMembersGrid');
                if (teamMembersGrid) {
                    const placeholder = document.getElementById('addMemberCard');
                    teamMembersGrid.innerHTML = '';
                    
                    // Usar for...of para soportar async/await
                    for (const member of projectData.members) {
                        await createMemberCard(member);
                    }
                    
                    if (placeholder) {
                        teamMembersGrid.appendChild(placeholder);
                    }
                }

                // Actualizar costo del equipo
                updateTeamCost();

                // Habilitar secondary-actions si hay miembros
                if (membersList.length > 0) {
                    enableSecondaryActions();
                }
            }

            // Cargar chips de Associated Projects
            // Limpiar chips existentes antes de cargar nuevos
            const chipsContainer = document.getElementById('projectsChipsContainer');
            const associatedProjectsInput = document.getElementById('associatedProjects');
            
            if (chipsContainer) {
                // Limpiar todos los chips existentes
                chipsContainer.innerHTML = '';
                console.log('🧹 Chips de Associated Projects limpiados antes de cargar');
            }
            
            if (associatedProjectsInput) {
                // Limpiar el input también
                associatedProjectsInput.value = '';
            }
            
            // Cargar chips si hay proyectos guardados (independientemente del status)
            // Los chips deben mostrarse para permitir edición
            if (projectData.projects && Array.isArray(projectData.projects) && projectData.projects.length > 0) {
                if (chipsContainer && associatedProjectsInput) {
                    console.log('📋 Cargando chips de Associated Projects:', projectData.projects.length, 'chips');
                    let chipsCargados = 0;
                    projectData.projects.forEach(projectName => {
                        if (projectName && typeof projectName === 'string' && projectName.trim().length > 0) {
                            const chip = createProjectChip(projectName.trim());
                            chipsContainer.appendChild(chip);
                            chipsCargados++;
                            console.log('✅ Chip cargado:', projectName.trim());
                        }
                    });
                    console.log(`✅ Total de chips cargados: ${chipsCargados}/${projectData.projects.length}`);
                } else {
                    console.warn('⚠️ chipsContainer o associatedProjectsInput no encontrados');
                }
            } else {
                console.log('ℹ️ No hay chips de Associated Projects para cargar');
            }

            // Cargar búsqueda si existe
            if (projectData.searchQuery) {
                document.getElementById('searchInput').value = projectData.searchQuery;
            }
        }

        // ============================================
        // Utilities
        // ============================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
