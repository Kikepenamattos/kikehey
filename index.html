<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docu - Iniciar Sesión</title>
    
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Logo -->
            <div class="logo">
                <img src="images/logo.svg" alt="Logo Docu" class="logo-img">
            </div>

            <!-- Texto de bienvenida -->
            <div class="welcome-text">
                <h1>Easy projects, easy management.</h1>
                <p>Create and manage projects as never before; with simple clicks, great results.</p>
            </div>

            <!-- Formulario de login -->
            <form class="login-form" id="loginForm">
                <!-- Input Email -->
                <div class="form-group">
                    <div class="input-label-row">
                        <label for="email" class="input-label">
                            Email adress
                            <img src="images/asterisk.svg" alt="Required" class="asterisk-icon">
                        </label>
                    </div>
                    <div class="input-container">
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="email@email.com"
                            required
                        >
                    </div>
                </div>

                <!-- Input Password -->
                <div class="form-group">
                    <div class="input-label-row">
                        <label for="password" class="input-label">
                            Password
                            <img src="images/asterisk.svg" alt="Required" class="asterisk-icon">
                        </label>
                    </div>
                    <div class="input-container input-container--with-icon">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="12345"
                            required
                        >
                        <span class="input-container__icon" id="passwordToggle" aria-label="Toggle password visibility">
                            <img src="images/eye_hidden.svg" alt="Password is hidden - Click to show" class="eye-icon" id="eyeIcon">
                        </span>
                    </div>
                </div>

                <!-- Botón Log in -->
                <button type="submit" class="login-button">
                    <span>Log in</span>
                    <img src="images/right-chevron.svg" alt="Right chevron" class="right-chevron-icon">
                </button>
            </form>

            <!-- Enlace de registro -->
            <div class="signup-link">
                <span>¿</span>No account<span>? </span>
                <a href="#" id="signupLink">Create an account</a>
            </div>

            <!-- Botón de Google -->
            <button class="google-button" id="googleButton">
                <img src="images/Google.svg" alt="Google" class="google-icon">
                <span>Continue with Google</span>
            </button>

            <!-- Ilustración del barco -->
            <div class="illustration">
                <img src="images/barco_vector.svg" alt="Ilustración del barco" class="boat-illustration-img">
            </div>
        </div>
    </div>

    <script>
        class LoginManager {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.emailInput = document.getElementById('email');
                this.passwordInput = document.getElementById('password');
                this.passwordToggle = document.getElementById('passwordToggle');
                this.googleButton = document.getElementById('googleButton');
                this.signupLink = document.getElementById('signupLink');
                
                this.init();
            }

            init() {
                this.bindEvents();
                this.setupPasswordToggle();
            }

            bindEvents() {
                this.form.addEventListener('submit', (e) => this.handleLogin(e));
                this.googleButton.addEventListener('click', () => this.handleGoogleLogin());
                this.signupLink.addEventListener('click', (e) => this.handleSignup(e));
            }

            setupPasswordToggle() {
                const eyeIcon = document.getElementById('eyeIcon');
                if (!eyeIcon || !this.passwordToggle) return;
                
                // Función para actualizar el icono según el estado actual del texto
                // eye.svg → texto VISIBLE (muestra el texto)
                // eye_hidden.svg → texto OCULTO (oculta el texto)
                const updateIcon = () => {
                    const isPassword = this.passwordInput.type === 'password';
                    
                    if (isPassword) {
                        // Texto está OCULTO → mostrar eye_hidden.svg
                        eyeIcon.src = 'images/eye_hidden.svg';
                        eyeIcon.alt = 'Password is hidden - Click to show';
                    } else {
                        // Texto está VISIBLE → mostrar eye.svg
                        eyeIcon.src = 'images/eye.svg';
                        eyeIcon.alt = 'Password is visible - Click to hide';
                    }
                };
                
                // Inicializar el icono según el estado actual (inicialmente está oculto)
                updateIcon();
                
                // Event listener para toggle
                this.passwordToggle.addEventListener('click', () => {
                    // Cambiar el tipo del input
                    const currentType = this.passwordInput.type;
                    const newType = currentType === 'password' ? 'text' : 'password';
                    this.passwordInput.type = newType;
                    
                    // Actualizar el icono después del cambio
                    updateIcon();
                });
            }

            handleLogin(e) {
                e.preventDefault();
                
                const email = this.emailInput.value.trim();
                const password = this.passwordInput.value.trim();
                
                if (!email || !password) {
                    alert('Por favor completa todos los campos');
                    return;
                }
                
                // Simular proceso de login
                this.showLoading();
                
                setTimeout(() => {
                    // Guardar email para futuras sesiones
                    localStorage.setItem('docu-user-email', email);
                    
                    // Redirigir al dashboard (por ahora mostrar mensaje)
                    alert('¡Login exitoso! Redirigiendo al dashboard...');
                    // window.location.href = 'dashboard.html'; // Cuando creemos el dashboard
                }, 1500);
            }

            handleGoogleLogin() {
                this.showLoading();
                // Aquí implementarías la autenticación real con Google
                setTimeout(() => {
                    alert('¡Login con Google exitoso! Redirigiendo al dashboard...');
                    // window.location.href = 'dashboard.html'; // Cuando creemos el dashboard
                }, 1500);
            }

            handleSignup(e) {
                e.preventDefault();
                // Redirigir a la página de registro
                window.location.href = 'sign_up.html';
            }

            showLoading() {
                const button = this.form.querySelector('.login-button');
                const originalText = button.innerHTML;
                
                button.innerHTML = 'Iniciando sesión...';
                button.disabled = true;
                button.style.opacity = '0.7';
                
                // Restaurar después de un tiempo
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                    button.style.opacity = '1';
                }, 2000);
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            new LoginManager();
        });
    </script>
</body>
</html>
