<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project View - Docu</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="design-system/tokens/index.css">
    <link rel="stylesheet" href="design-system/components/navigation.css">
    <link rel="stylesheet" href="design-system/components/input.css">
    <link rel="stylesheet" href="design-system/components/button.css">
    <link rel="stylesheet" href="design-system/components/tabs-chip.css">
    <link rel="stylesheet" href="design-system/components/card.css">
    <link rel="stylesheet" href="design-system/components/date-picker.css">
    <link rel="stylesheet" href="design-system/components/status-button.css">
    <link rel="stylesheet" href="design-system/components/progress-bar.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            background-color: var(--color-surface-regular, #ffffff);
            color: var(--color-text-primary, #0a243f);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Layout Principal */
        .project-view-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenido Principal */
        .project-content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        .project-content {
            flex: 1;
            padding: 64px 173px 0 135px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 80%;
            margin: 0 auto;
            padding-bottom: 64px;
        }

        /* Project Name Container */
        .project-name-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-16);
        }

        /* Project Name Title - Según Figma */
        .project-name-title {
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            font-size: 32px;
            font-weight: 800;
            color: var(--color-text-primary, #0a243f);
            line-height: normal;
            margin: 0;
            padding: 0;
            flex: 1;
        }

        /* Project Actions */
        .project-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-12);
        }

        /* Edit Project Link - Según Figma */
        .edit-project-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            font-size: 14px;
            font-weight: 400;
            color: var(--color-text-primary, #0a243f);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .edit-project-link:hover {
            opacity: 0.7;
        }

        .edit-project-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
        }

        .edit-project-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Budget Section - Según Figma */
        .project-budget-section {
            /* margin-bottom: var(--spacing-24); */
        }

        .budget-allocation-display {
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            font-size: 14px;
            line-height: normal;
        }

        .budget-label {
            font-weight: 400;
            color: var(--color-text-primary, #0a243f);
        }

        .budget-value {
            font-weight: 700;
            color: var(--color-text-primary, #0a243f);
        }

        .budget-currency {
            font-weight: 700;
            color: var(--color-text-primary, #0a243f);
            display: inline-block;
        }

        /* Project Date and Status Section - Según Figma */
        .project-date-status-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            /* margin-top: var(--spacing-48); */
            margin-bottom: var(--spacing-24);
        }

        .project-date-status-section .dsu-date-button-wrapper {
            position: relative;
        }

        /* Date Button en modo publicado - mantiene estilos pero disabled */
        .project-date-status-section .dsu-button--tertiary:disabled {
            cursor: default;
            opacity: 1;
        }

        .project-date-status-section .dsu-agreements__date-button-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .project-date-status-section .dsu-agreements__date-button-icon img {
            width: 13.333px;
            height: 13.333px;
            object-fit: contain;
        }

        /* Project Status Wrapper */
        .project-status-wrapper {
            display: flex;
            align-items: center;
            gap: var(--spacing-16);
        }

        /* Share Project Button */
        .project-status-wrapper .dsu-button--secondary {
            margin-left: 0;
        }

        .project-status-label {
            font-family: var(--font-family-secondary);
            font-size: 14px;
            font-weight: 400;
            color: var(--color-text-primary, #0a243f);
            width: 206px;
        }

        /* Status Button en modo publicado - sin cursor pointer ni hover */
        .project-date-status-section .dsu-status-button-wrapper {
            position: relative;
            display: inline-block;
        }

        .project-date-status-section .dsu-status-button {
            cursor: default;
            pointer-events: none;
        }

        .project-date-status-section .dsu-status-button:hover {
            /* Sin cambios en hover para modo publicado */
        }

        /* Estilos para botones small en project-date-status-section */
        .project-date-status-section .dsu-button--small {
            padding: 8px 0;
            height: 37px;
            font-size: 14px;
            border-radius: 40px;
            gap: 8px;
        }


        /* Section Styles */
        .project-section {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
            margin-top: var(--spacing-24);
        }

        .project-section-title {
            font-family: var(--font-family-secondary);
            font-size: 24px;
            font-weight: var(--font-weight-black);
            color: var(--color-text-primary);
            margin: 0;
        }

        /* Project Stages Header */
        .project-stages-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: var(--spacing-24);
        }

        .overall-progress-wrapper {
            display: flex;
            align-items: center;
            gap: var(--spacing-12);
        }

        .overall-progress-label {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-regular);
            color: var(--color-text-primary);
            white-space: nowrap;
        }

        .overall-progress-wrapper .dsu-progress {
            min-width: 200px;
        }

        /* Stages Display - Cards horizontales según Figma */
        .stages-list {
            display: flex;
            flex-direction: row;
            gap: var(--spacing-16);
            flex-wrap: wrap;
        }

        .stage-item {
            flex: 1;
            min-width: 200px;
            max-width: 100%;
        }

        /* Estilos para stages inactivos (texto gris claro) */
        .stage-item--inactive .dsu-stage-status__badge-text,
        .stage-item--inactive .dsu-stage-status__date {
            color: var(--color-text-secondary, #6b7b8a);
        }

        .stage-item--inactive .dsu-stage-status__badge {
            background-color: var(--color-surface-especial, #f4f7fb);
        }

        /* Project Objective Section Styles */
        .project-objective-tabs {
            display: flex;
            gap: var(--spacing-08);
            align-items: center;
        }

        .project-objective-content {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
            width: 100%;
        }

        .project-objective-items-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-08);
            width: 100%;
            min-height: 0;
        }

        .project-objective-items-container[style*="display: none"] {
            display: none !important;
        }

        .project-objective-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-08);
            padding: var(--spacing-12) var(--spacing-16);
            background-color: var(--color-surface-regular);
            border: 1px solid var(--color-status-disabled);
            border-radius: var(--radius-md);
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
        }

        .project-objective-item-text {
            flex: 1;
            margin: 0;
        }

        .project-objective-item-actions {
            display: flex;
            gap: var(--spacing-08);
        }

        .project-objective-item-action {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: var(--spacing-04);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-objective-item-action img {
            width: 16px;
            height: 16px;
        }

        /* With Members Component Styles */
        .with-members-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .with-members-row__left {
            display: flex;
            align-items: center;
            margin-right: 8px;
        }

        .avatars-row {
            display: inline-flex;
            align-items: center;
        }

        .avatar {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(10, 36, 63, 0.15);
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar + .avatar {
            margin-left: -12px;
        }

        .avatar__img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .avatar--overflow {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--color-surface-especial);
            border: 1px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(10, 36, 63, 0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #0A243F;
            font-family: var(--font-family-secondary);
            font-weight: var(--font-weight-bold);
            font-size: 14px;
            margin-left: -12px;
            flex-shrink: 0;
        }

        /* Team Title (from Figma) */
        .team-name-title {
            font-family: var(--font-family-secondary);
            font-size: 14px;
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            line-height: 1.5;
            margin: 0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-08);
        }
        
        .team-name-title__text {
            flex: 1;
        }

        /* Teams List Container */
        .teams-list-container {
            display: flex;
            flex-direction: row;
            gap: 32px;
            width: 100%;
            align-content: center;
            align-items: end;
        }

        /* Individual Team Item */
        .team-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Assets Display */
        .assets-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-12);
        }

        .asset-item {
            padding: var(--spacing-12);
            background-color: var(--color-surface-especial);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-basics-gray);
        }

        .asset-text {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-base);
            color: var(--color-text-primary);
        }

        .asset-link {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            color: var(--color-basics-dark-blue);
            text-decoration: none;
        }

        .asset-link:hover {
            text-decoration: underline;
        }

        /* Rich Text Content Styles */
        .rich-text-content {
            padding: var(--spacing-16);
            background-color: var(--color-surface-regular);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-basics-gray);
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-base);
            color: var(--color-text-primary);
            line-height: 1.6;
        }

        .rich-text-content p {
            margin: 0 0 var(--spacing-12) 0;
        }

        .rich-text-content p:last-child {
            margin-bottom: 0;
        }

        .rich-text-content ul,
        .rich-text-content ol {
            margin: 0 0 var(--spacing-12) 0;
            padding-left: var(--spacing-24);
        }

        .rich-text-content a {
            color: var(--color-basics-dark-blue);
            text-decoration: none;
        }

        .rich-text-content a:hover {
            text-decoration: underline;
        }

        /* Deliverables Section Styles */
        .deliverables-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-12);
        }

        .deliverable-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-12);
            padding: var(--spacing-12) var(--spacing-16);
            background-color: var(--color-surface-especial);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-basics-gray);
        }

        .deliverable-item-preview {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            object-fit: cover;
            flex-shrink: 0;
        }

        .deliverable-item-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-status-disabled);
            border-radius: var(--radius-md);
            flex-shrink: 0;
        }

        .deliverable-item-icon img {
            width: 24px;
            height: 24px;
        }

        .deliverable-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-04);
        }

        .deliverable-item-text {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
            margin: 0;
            word-break: break-word;
        }

        .deliverable-item-link {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            margin: 0;
            word-break: break-all;
        }

        .deliverable-item-link a {
            color: var(--color-basics-dark-blue);
            text-decoration: none;
        }

        .deliverable-item-link a:hover {
            text-decoration: underline;
        }

        /* Agreements Section Styles */
        .agreements-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
        }

        .agreement-item {
            padding: var(--spacing-16);
            background-color: var(--color-surface-regular);
            border: 1px solid var(--color-status-disabled);
            border-radius: var(--radius-md);
        }

        .agreement-item-title {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-black);
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-12);
        }

        .agreement-item-meta {
            display: flex;
            align-items: center;
            gap: var(--spacing-16);
            margin-bottom: var(--spacing-12);
        }

        .agreement-item-date {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .agreement-item-status {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            padding: var(--spacing-04) var(--spacing-08);
            border-radius: var(--radius-sm);
        }

        .agreement-item-status--to-start {
            background-color: var(--color-status-to-start-bg, #f0f0f0);
            color: var(--color-status-to-start-text, #666);
        }

        .agreement-item-status--in-progress {
            background-color: var(--color-status-in-progress-bg, #e3f2fd);
            color: var(--color-status-in-progress-text, #1976d2);
        }

        .agreement-item-status--paused {
            background-color: var(--color-status-paused-bg, #fff3e0);
            color: var(--color-status-paused-text, #f57c00);
        }

        .agreement-item-status--done {
            background-color: var(--color-status-done-bg, #e8f5e9);
            color: var(--color-status-done-text, #388e3c);
        }

        .agreement-item-items {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-08);
        }

        .agreement-item-item {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
            padding-left: var(--spacing-08);
        }

        .asset-link:hover {
            text-decoration: underline;
        }

        /* Empty State */
        .empty-state {
            padding: var(--spacing-24);
            text-align: center;
            color: var(--color-text-secondary);
            font-style: italic;
        }

    </style>
</head>
<body>
    <div class="project-view-container">
        <!-- Sidebar Navigation -->
        <nav class="dsu-sidebar">
            <div class="dsu-sidebar__main">
                <!-- Logo Container -->
                <div class="dsu-sidebar__logo-container">
                    <a href="#" class="dsu-sidebar__logo">
                        <img src="images/logo.svg" alt="Docu Logo">
                    </a>
                </div>
                
                <!-- Navigation Wrapper -->
                <div class="dsu-sidebar__navigation-wrapper">
                    <!-- Navigation Main -->
                    <div class="dsu-sidebar__navigation">
                        <!-- Teams Level -->
                        <div class="dsu-teams-level">
                            <button class="dsu-teams-button dsu-teams-button--active">
                                <span class="dsu-teams-button__icon">
                                    <img src="images/team.svg" alt="Teams">
                                </span>
                                <span class="dsu-nav-button__text">Teams</span>
                            </button>
                            <div class="dsu-teams-chevron">
                                <img src="images/up-chevron.svg" alt="Chevron">
                            </div>
                        </div>
                        
                        <!-- Teams Dropdown -->
                        <div class="dsu-teams-dropdown dsu-teams-dropdown--expanded">
                            <button class="dsu-teams-create" id="createTeamBtn">
                                <span>Create new team</span>
                                <span class="dsu-teams-create__icon">
                                    <img src="images/plus.svg" alt="Plus">
                                </span>
                            </button>
                            <div class="dsu-teams-list" id="teamsList">
                                <!-- Teams list se poblará dinámicamente -->
                            </div>
                        </div>
                        
                        <!-- Projects Level -->
                        <div class="dsu-projects-button">
                            <div class="dsu-projects-level">
                                <button class="dsu-projects-button__trigger dsu-projects-button__trigger--active">
                                    <span class="dsu-projects-button__icon">
                                        <img src="images/project.svg" alt="Projects">
                                    </span>
                                    <span class="dsu-projects-button__text">Projects</span>
                                </button>
                                <div class="dsu-projects-chevron">
                                    <img src="images/up-chevron.svg" alt="Chevron">
                                </div>
                            </div>
                            
                            <!-- Projects Dropdown -->
                            <div class="dsu-projects-dropdown dsu-projects-dropdown--expanded">
                                <button class="dsu-projects-create" id="createProjectBtn">
                                    <span>Create new project</span>
                                    <span class="dsu-projects-create__icon">
                                        <img src="images/plus.svg" alt="Plus">
                                    </span>
                                </button>
                                <!-- Projects list -->
                                <div class="dsu-projects-list" id="projectsList">
                                    <!-- Projects list se poblará dinámicamente -->
                                </div>
                            </div>
                        </div>
                        
                        <!-- Profile Button -->
                        <button class="dsu-nav-button">
                            <span class="dsu-nav-button__icon">
                                <img src="images/avatar.svg" alt="Profile">
                            </span>
                            <span class="dsu-nav-button__text">Profile</span>
                        </button>
                        
                        <!-- Feedback Button -->
                        <button class="dsu-nav-button">
                            <span class="dsu-nav-button__icon">
                                <img src="images/chat.svg" alt="Feedback">
                            </span>
                            <span class="dsu-nav-button__text">Give us feedback</span>
                        </button>
                    </div>
                    
                    <!-- Sidebar Footer -->
                    <div class="dsu-sidebar__footer">
                        <button class="dsu-nav-button" id="darkModeBtn">
                            <span class="dsu-nav-button__icon">
                                <img src="images/moon.svg" alt="Dark Mode">
                            </span>
                            <span class="dsu-nav-button__text">Dark mode</span>
                        </button>
                        <button class="dsu-nav-button" id="logoutBtn">
                            <span class="dsu-nav-button__icon">
                                <img src="images/exit.svg" alt="Logout">
                            </span>
                            <span class="dsu-nav-button__text">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="project-content-wrapper">
            <div class="project-content">
                <!-- Project Name Container -->
                <div class="project-name-container">
                    <h1 class="project-name-title" id="projectNameDisplay">Project name</h1>
                    <div class="project-actions">
                        <a href="#" class="edit-project-link" id="editProjectBtn">
                            <span>Edit project</span>
                            <span class="edit-project-icon">
                                <img src="images/Edit.svg" alt="Edit">
                            </span>
                        </a>
                    </div>
                </div>
                
                <!-- Budget Allocation Section -->
                <div class="project-budget-section" id="budgetSection" style="display: none;">
                    <div class="budget-allocation-display">
                        <span class="budget-label">Budget allocation:</span>
                        <span class="budget-value" id="budgetDisplay"></span>
                        <span class="budget-currency" id="currencyDisplay"></span>
                    </div>
                </div>
                
                <!-- Project Date and Status Section -->
                <div class="project-date-status-section" id="dateStatusSection" style="display: none;">
                    <div class="dsu-date-button-wrapper">
                        <button class="dsu-button dsu-button--tertiary dsu-button--small" disabled>
                            <span class="dsu-agreements__date-button-icon">
                                <img src="images/calendar.svg" alt="Calendar">
                            </span>
                            <span id="projectDateDisplay">Select a date to deliver the project</span>
                        </button>
                    </div>
                    
                    <div class="project-status-wrapper">
                        <span class="project-status-label">Project status:</span>
                        <div class="dsu-status-button-wrapper">
                            <div class="dsu-status-button dsu-status-button--to-start" id="projectStatusDisplay">
                                <span>To start</span>
                            </div>
                        </div>
                        <button class="dsu-button dsu-button--secondary dsu-button--small" id="shareProjectBtn">
                            <span class="dsu-button__text">Share project</span>
                        </button>
                    </div>
                </div>
                
                <!-- Project Stages -->
                <div class="project-section" id="stagesSection" style="display: none;">
                    <div class="project-stages-header">
                        <h2 class="project-section-title">Project stages</h2>
                        <div class="overall-progress-wrapper">

    <script>
        // ============================================
        // Helper function para obtener imagen (IndexedDB o base64)
        // ============================================
        async function getMemberImage(memberImageRef) {
            if (!memberImageRef || memberImageRef.trim() === '') {
                return 'images/avatar_icon.svg';
            }
            
            // Si es referencia de IndexedDB
            if (memberImageRef.startsWith('indexeddb:')) {
                const imageId = memberImageRef.replace('indexeddb:', '');
                if (typeof DocuImageStorage !== 'undefined' && DocuImageStorage.isAvailable()) {
                    try {
                        const imageData = await DocuImageStorage.getImage(imageId);
                        return imageData || 'images/avatar_icon.svg';
                    } catch (error) {
                        console.error('❌ Error al cargar imagen de IndexedDB:', error);
                        return 'images/avatar_icon.svg';
                    }
                } else {
                    console.warn('⚠️ IndexedDB no disponible');
                    return 'images/avatar_icon.svg';
                }
            }
            
            // Si es base64, retornar directamente
            if (memberImageRef.startsWith('data:')) {
                return memberImageRef;
            }
            
            // Fallback
            return 'images/avatar_icon.svg';
        }
        
        // ============================================
        // Verificación de Sesión
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof window.DocuAuth === 'undefined' || !DocuAuth.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }

            initProjectViewPage();
        });

        function initProjectViewPage() {
            if (typeof window.DocuAuth === 'undefined' || typeof window.DocuProjectData === 'undefined') {
                setTimeout(initProjectViewPage, 100);
                return;
            }

            console.log('Inicializando project_view.html');

            // Inicializar navegación del sidebar
            initSidebarNavigation();

            // Cargar teams y proyectos en el sidebar
            loadTeamsInSidebar();
            loadProjectsInSidebar();

            // Cargar datos del proyecto
            loadProjectData();

            // Inicializar botones de acción
            initActionButtons();
        }

        // Initialize Action Buttons
        function initActionButtons() {
            // Edit Project Link
            const editProjectBtn = document.getElementById('editProjectBtn');
            if (editProjectBtn) {
                editProjectBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Obtener el ID del proyecto actual desde la URL o sessionStorage
                    const urlParams = new URLSearchParams(window.location.search);
                    const projectId = urlParams.get('id') || sessionStorage.getItem('docu_selected_project_id');
                    
                    if (projectId) {
                        // Guardar el ID del proyecto en sessionStorage para que project_empty.html lo cargue
                        try {
                            sessionStorage.setItem('docu_selected_project_id', projectId);
                            sessionStorage.setItem('docu_editing_project', 'true');
                        } catch (error) {
                            console.warn('⚠️ No se pudo guardar en sessionStorage:', error);
                        }
                        
                        // Redirigir a project_empty.html con el ID del proyecto
                        window.location.href = `project_empty.html?id=${projectId}`;
                    } else {
                        // Si no hay ID, ir a project_empty.html sin parámetros
                        console.warn('⚠️ No se encontró ID del proyecto, redirigiendo a project_empty.html');
                        window.location.href = 'project_empty.html';
                    }
                });
            }
        }

        // Sidebar Navigation
        function initSidebarNavigation() {
            // Teams Dropdown - Asegurar que siempre esté expandido por defecto
            const teamsButtons = document.querySelectorAll('.dsu-teams-button');
            teamsButtons.forEach((button) => {
                const teamsLevel = button.closest('.dsu-teams-level');
                if (!teamsLevel) return;
                
                const chevron = teamsLevel.querySelector('.dsu-teams-chevron img');
                const dropdown = teamsLevel.parentElement.querySelector('.dsu-teams-dropdown');
                
                if (!dropdown) return;
                
                // Asegurar que siempre esté expandido por defecto
                dropdown.classList.add('dsu-teams-dropdown--expanded');
                button.classList.add('dsu-teams-button--active');
                if (chevron) chevron.src = 'images/up-chevron.svg';
                
                button.addEventListener('click', function() {
                    const isExpanded = dropdown.classList.contains('dsu-teams-dropdown--expanded');
                    
                    if (isExpanded) {
                        dropdown.classList.remove('dsu-teams-dropdown--expanded');
                        button.classList.remove('dsu-teams-button--active');
                        if (chevron) chevron.src = 'images/down-chevron.svg';
                    } else {
                        dropdown.classList.add('dsu-teams-dropdown--expanded');
                        button.classList.add('dsu-teams-button--active');
                        if (chevron) chevron.src = 'images/up-chevron.svg';
                    }
                });

                if (chevron && chevron.closest('.dsu-teams-chevron')) {
                    chevron.closest('.dsu-teams-chevron').addEventListener('click', function() {
                        button.click();
                    });
                }
            });

            // Projects Dropdown - Asegurar que siempre esté expandido por defecto
            const projectsTriggers = document.querySelectorAll('.dsu-projects-button__trigger');
            projectsTriggers.forEach((trigger) => {
                const projectsLevel = trigger.closest('.dsu-projects-level');
                if (!projectsLevel) return;
                
                const chevron = projectsLevel.querySelector('.dsu-projects-chevron img');
                const projectsButton = trigger.closest('.dsu-projects-button');
                const dropdown = projectsButton.querySelector('.dsu-projects-dropdown');
                
                if (!dropdown) return;
                
                // Asegurar que siempre esté expandido por defecto
                dropdown.classList.add('dsu-projects-dropdown--expanded');
                trigger.classList.add('dsu-projects-button__trigger--active');
                if (chevron) chevron.src = 'images/up-chevron.svg';
                
                // Permitir toggle normal
                trigger.addEventListener('click', function() {
                    const isExpanded = dropdown.classList.contains('dsu-projects-dropdown--expanded');
                    
                    if (isExpanded) {
                        dropdown.classList.remove('dsu-projects-dropdown--expanded');
                        trigger.classList.remove('dsu-projects-button__trigger--active');
                        if (chevron) chevron.src = 'images/down-chevron.svg';
                    } else {
                        dropdown.classList.add('dsu-projects-dropdown--expanded');
                        trigger.classList.add('dsu-projects-button__trigger--active');
                        if (chevron) chevron.src = 'images/up-chevron.svg';
                    }
                });

                if (chevron && chevron.closest('.dsu-projects-chevron')) {
                    chevron.closest('.dsu-projects-chevron').addEventListener('click', function() {
                        trigger.click();
                    });
                }
            });

            // Create New Team Button
            const createTeamBtn = document.getElementById('createTeamBtn');
            if (createTeamBtn) {
                createTeamBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.location.href = 'create_team.html';
                });
            }

            // Create New Project Button
            const createProjectBtn = document.getElementById('createProjectBtn');
            if (createProjectBtn) {
                createProjectBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    try {
                        sessionStorage.removeItem('docu_selected_project_id');
                        sessionStorage.setItem('docu_create_new_project', 'true');
                    } catch (error) {
                        console.warn('⚠️ No se pudo limpiar sessionStorage:', error);
                    }
                    window.location.href = 'project_empty.html';
                });
            }

            // Dark Mode Button
            const darkModeBtn = document.getElementById('darkModeBtn');
            if (darkModeBtn) {
                darkModeBtn.addEventListener('click', function() {
                    // Toggle dark mode functionality
                    document.body.classList.toggle('dark-mode');
                    const isDarkMode = document.body.classList.contains('dark-mode');
                    try {
                        localStorage.setItem('darkMode', isDarkMode ? 'enabled' : 'disabled');
                    } catch (error) {
                        console.warn('⚠️ No se pudo guardar el estado de dark mode:', error);
                    }
                });
            }

            // Logout Button
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                        DocuAuth.logout();
                        window.location.href = 'index.html';
                    }
                });
            }
        }

        // Load Teams in Sidebar (simplificada)
        function loadTeamsInSidebar() {
            const teamsList = document.getElementById('teamsList');
            if (!teamsList) return;

            const projectData = DocuProjectData.getProjectData();
            const teams = (projectData && projectData.teams) ? projectData.teams.filter(t => t.status === 'published') : [];
            
            teamsList.innerHTML = '';
            teams.forEach(team => {
                const teamItem = document.createElement('button');
                teamItem.className = 'dsu-team-item';
                teamItem.setAttribute('data-team-id', team.id || '');
                teamItem.innerHTML = `<span class="dsu-team-item__text">${team.name || 'Sin nombre'}</span>`;
                teamItem.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Remover clase active de todos los items
                    teamsList.querySelectorAll('.dsu-team-item').forEach(item => {
                        item.classList.remove('dsu-team-item--active', 'active');
                    });
                    
                    // Agregar clase active al item clickeado
                    teamItem.classList.add('dsu-team-item--active', 'active');
                    
                    // Guardar en sessionStorage
                    try {
                        sessionStorage.setItem('docu_selected_team_id', team.id);
                    } catch (error) {
                        console.warn('⚠️ Error al guardar en sessionStorage:', error);
                    }
                    
                    window.location.href = `team_filled.html?id=${team.id}`;
                });
                teamsList.appendChild(teamItem);
            });
            
            // Marcar team activo si hay uno seleccionado
            markActiveTeam();
        }

        // Función para marcar el team activo
        function markActiveTeam() {
            const teamsList = document.getElementById('teamsList');
            if (!teamsList) return;

            // Obtener ID del team desde URL o sessionStorage
            const urlParams = new URLSearchParams(window.location.search);
            const teamIdFromURL = urlParams.get('id');
            let selectedTeamId = teamIdFromURL;

            if (!selectedTeamId) {
                try {
                    selectedTeamId = sessionStorage.getItem('docu_selected_team_id');
                } catch (error) {
                    console.warn('⚠️ Error al leer sessionStorage:', error);
                }
            }

            if (selectedTeamId) {
                setTimeout(() => {
                    const teamItems = teamsList.querySelectorAll('.dsu-team-item');
                    teamItems.forEach(item => {
                        item.classList.remove('dsu-team-item--active', 'active');
                        const itemId = item.getAttribute('data-team-id');
                        if (itemId === selectedTeamId) {
                            item.classList.add('dsu-team-item--active', 'active');
                            console.log('✅ Team marcado como activo en el sidebar:', selectedTeamId);
                        }
                    });
                }, 100);
            }
        }

        // Load Projects in Sidebar (simplificada)
        function loadProjectsInSidebar() {
            const projectsList = document.getElementById('projectsList');
            if (!projectsList) return;

            const projectData = DocuProjectData.getProjectData();
            const projects = (projectData && projectData.projects) ? projectData.projects : [];
            
            projectsList.innerHTML = '';
            projects.forEach(project => {
                const projectItem = document.createElement('button');
                projectItem.className = 'dsu-project-item';
                projectItem.setAttribute('data-project-id', project.id || '');
                projectItem.innerHTML = `<span class="dsu-project-item__text">${project.name || 'Sin nombre'}</span>`;
                projectItem.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Remover clase active de todos los items
                    projectsList.querySelectorAll('.dsu-project-item').forEach(item => {
                        item.classList.remove('dsu-project-item--active', 'active');
                    });
                    
                    // Agregar clase active al item clickeado
                    projectItem.classList.add('dsu-project-item--active', 'active');
                    
                    // Guardar en sessionStorage
                    try {
                        sessionStorage.setItem('docu_selected_project_id', project.id);
                    } catch (error) {
                        console.warn('⚠️ Error al guardar en sessionStorage:', error);
                    }
                    
                    window.location.href = `project_view.html?id=${project.id}`;
                });
                projectsList.appendChild(projectItem);

            // Marcar proyecto activo si hay uno seleccionado
