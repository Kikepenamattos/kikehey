<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Filled - Docu</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="design-system/tokens/index.css">
    <link rel="stylesheet" href="design-system/components/navigation.css">
    <link rel="stylesheet" href="design-system/components/input.css">
    <link rel="stylesheet" href="design-system/components/button.css">
    <link rel="stylesheet" href="design-system/components/chip.css">
    <link rel="stylesheet" href="design-system/components/card.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            background-color: var(--color-surface-regular, #ffffff);
            color: var(--color-text-primary, #0a243f);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Layout Principal */
        .create-team-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenido Principal */
        .team-content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        #stageModalOverlay .dsu-status-button-wrapper {
            position: relative;
            z-index: 100;
            width: 100%;
        }

        .dsu-status-button-wrapper {
            position: relative;
            /* z-index: 50; */
            /* width: 100%; */
        }

        .team-content {
            flex: 1;
            padding: 64px 173px 0 135px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 80%;
            margin: 0 auto;
        }

        /* Data Level - Formulario principal */
        .data-level {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Name Level */
        .name-level {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }

        .project-name-group {
            flex: 1;
            max-width: 1606px;
        }

        /* Project name display para teams publicados */
        .project-name-display {
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            font-size: 32px;
            font-weight: 800;
            color: var(--color-text-primary, #0a243f);
            line-height: normal;
            margin: 0;
            padding: 0;
            flex: 1;
        }

        .project-name-group.published .dsu-input-label {
            display: none;
        }

        .team-cost-group {
            flex: 1;
            max-width: 1606px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Team Description Section */
        .team-description-section {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
            width: 100%;
            margin-top: var(--spacing-24);
        }

        .team-description-header {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-08);
            width: 100%;
        }

        .team-description-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-08) 0;
        }

        .team-description-section-title__text {
            font-family: var(--font-family-secondary);
            font-size: 24px;
            font-weight: var(--font-weight-black);
            color: var(--color-text-primary);
            margin: 0;
        }

        .team-description-section-content {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
            width: 100%;
        }

        .team-description-content {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
            width: 100%;
        }

        .team-description-display {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-regular);
            color: var(--color-text-primary);
            line-height: var(--line-height-normal);
            width: 100%;
        }

        .team-description-display p {
            margin: 0 0 var(--spacing-12) 0;
        }

        .team-description-display p:last-child {
            margin-bottom: 0;
        }

        .team-description-display a {
            color: var(--color-basics-dark-blue);
            text-decoration: underline;
        }

        .team-description-display a:hover {
            color: var(--color-basics-mid-blue);
        }

        .team-description-display ul,
        .team-description-display ol {
            margin: var(--spacing-12) 0;
            padding-left: var(--spacing-24);
        }

        .team-description-display li {
            margin-bottom: var(--spacing-08);
        }

        .search-input-group {
            flex: 1;
        }

        .associated-projects-group {
            /* flex: 1; */
        }

        /* Input width override para create_team */
        .dsu-input {
            /* max-width: 840px; */
        }
        
        /* Asegurar que el icono del buscador esté dentro del input */
        .dsu-input-buscador {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .dsu-input-buscador .dsu-input {
            padding-right: calc(var(--spacing-16) + 20px + var(--spacing-08));
            box-sizing: border-box;
        }
        
        .dsu-input-buscador__send-icon {
            position: absolute;
            right: var(--spacing-16);
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.2s ease, transform 0.2s ease;
            margin: 0;
            padding: 0;
        }
        
        .dsu-input-buscador__send-icon--active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        
        .dsu-input-buscador__send-icon:hover {
            transform: translateY(-50%) scale(1.1);
        }
        
        .dsu-input-buscador__send-icon img,
        .dsu-input-buscador__send-icon svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Asegurar que el icono no se vea afectado por el estado disabled del contenedor */
        .secondary-actions.disabled .dsu-input-buscador__send-icon--active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }


        .btn-share-team {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid var(--color-text-primary, #0a243f);
            border-radius: 40px;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-family-secondary, 'Lato');
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text-primary, #0a243f);
        }

        .btn-share-team:hover:not(:disabled) {
            opacity: 0.8;
        }

        .btn-share-team:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: var(--color-status-disabled, #efefef);
            color: var(--color-text-secondary, #6b7b8a);
            border-color: var(--color-status-disabled, #efefef);
        }

        .btn-add-member {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-buttons-primary-bg-default, #9dff00);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-family-secondary, 'Lato');
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-primary, #0a243f);
        }

        .btn-add-member:hover {
            background-color: var(--color-button-primary-bg-hover);
        }

        /* Modal Styles */
        /* Modal no se usa en vista publicada, ocultar completamente */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--color-overlay-light);
            display: none !important;
            align-items: center;
            justify-content: center;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px);
            visibility: hidden;
            pointer-events: none;
        }

        .modal-overlay.active {
            display: flex !important;
            opacity: 1 !important;
            visibility: visible !important;
        }

        .modal-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 24px;
            animation: modalContainerFadeIn 0.3s ease;
        }

        @keyframes modalContainerFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .add-member-modal {
            background: var(--color-basics-white);
            border: 1px solid var(--color-basics-mid-blue);
            border-radius: 10px;
            padding: 32px;
            max-width: 856px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--elevation-4);
        }

        /* Dark mode modal adjustments */
        [data-theme="dark"] .add-member-modal {
            background: var(--color-surface-regular);
            border-color: var(--color-basics-mid-blue);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-wrapper {
            display: flex;
            flex-direction: column;
            gap: 48px;
            margin: 0;
            padding: 0;
        }

        /* Modal Header */
        .modal-header-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .modal-headline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .modal-title {
            font-family: 'Lato', sans-serif;
            font-size: 24px;
            font-weight: var(--font-weight-black);
            color: var(--color-basics-dark-blue);
            margin: 0;
            padding: 0;
            flex: 1;
            line-height: normal;
        }

        /* Dark mode title adjustment */
        [data-theme="dark"] .modal-title {
            color: var(--color-basics-white);
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            transition: opacity 0.2s ease;
            margin: 0;
            margin-left: auto;
        }

        .modal-close-btn:hover {
            opacity: 0.7;
        }

        .modal-close-btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        /* Dark mode icon adjustment */
        [data-theme="dark"] .modal-close-btn img {
            filter: brightness(0) saturate(100%) invert(1);
        }

        .modal-description {
            font-family: var(--font-family-secondary);
            font-size: 16px;
            font-weight: var(--font-weight-regular);
            line-height: 1.5;
            color: var(--color-basics-dark-blue);
            margin: 0;
            padding: 0;
        }

        /* Dark mode description adjustment */
        [data-theme="dark"] .modal-description {
            color: var(--color-basics-white);
        }

        /* Modal Content */
        .modal-content-wrapper {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .modal-profile-avatar {
            width: 200px;
            height: 200px;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
        }

        .modal-inputs-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            min-width: 0;
            width: 424px;
            margin: 0;
            padding: 0;
        }

        .modal-input-row {
            display: flex;
            gap: 16px;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .modal-input-row .modal-input-group {
            flex: 1;
            min-width: 0;
            margin: 0;
            padding: 0;
        }

        .modal-input-group {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-04);
            width: 100%;
        }

        .modal-input-group .dsu-input-label {
            font-weight: var(--font-weight-black);
            font-size: 14px;
            margin: 0;
            padding: 0;
            margin-bottom: 4px;
        }

        .modal-input-group .dsu-input-label span::after {
            content: none;
        }

        .modal-input-group .dsu-input {
            margin: 0;
            padding: var(--spacing-12) var(--spacing-16);
            width: 100%;
            min-height: 48px;
        }

        /* Modal Buttons */
        .modal-buttons-level {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin: 0;
            padding: 0;
            gap: 0;
        }

        .modal-cancel-btn,
        .modal-add-btn {
            width: 152px;
            padding: 12px 24px;
            height: auto;
            min-height: 48px;
            margin: 0;
        }

        .modal-cancel-btn .dsu-button__icon,
        .modal-add-btn .dsu-button__icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .modal-cancel-btn .dsu-button__icon img,
        .modal-add-btn .dsu-button__icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Dark mode modal button icons */
        [data-theme="dark"] .modal-delete-btn .dsu-button__icon img,
        [data-theme="dark"] .modal-cancel-btn .dsu-button__icon img {
            filter: brightness(0) saturate(100%) invert(1);
        }

        /* Dark mode modal-add-btn (primary button) - keep icon dark for contrast on green background */
        [data-theme="dark"] .modal-add-btn.dsu-button--primary .dsu-button__icon img {
            filter: none; /* Keep icon dark for contrast on green background */
        }

        /* Avatar Preview in Modal */
        .modal-avatar-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-lg);
            z-index: 0;
        }

        .modal-profile-avatar .dsu-profile-avatar {
            width: 200px;
            height: 200px;
            position: relative;
        }

        /* Ensure avatar icon and preview are positioned correctly */
        .modal-profile-avatar .dsu-profile-avatar__icon {
            position: absolute;
            top: var(--spacing-08);
            left: var(--spacing-08);
            z-index: 0;
        }

        /* Profile Page Styles */
        .profile-page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: var(--spacing-24);
        }

        .profile-page-container {
            width: 100%;
            max-width: 1200px;
            max-height: 90vh;
            background-color: var(--color-surface-regular, #ffffff);
            border-radius: var(--radius-md, 8px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .profile-page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        .profile-page-header {
            display: flex;
            justify-content: flex-end;
            padding: var(--spacing-24);
            border-bottom: 1px solid var(--color-border-light, #e0e0e0);
        }

        .profile-page-close-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: var(--spacing-08);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }

        .profile-page-close-btn:hover {
            opacity: 0.7;
        }

        .profile-page-content {
            padding: var(--spacing-48) var(--spacing-64);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-32);
        }

        .profile-page-avatar {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-24);
        }

        .profile-page-avatar .dsu-profile-avatar {
            width: 200px;
            height: 200px;
        }

        .profile-page-avatar-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .profile-page-info {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-24);
        }

        .profile-page-input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-24);
        }

        .profile-page-input-group {
            margin-bottom: 0;
        }

        .profile-page-field {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-regular);
            line-height: 1.5;
            color: var(--color-text-primary);
            padding: var(--spacing-12) var(--spacing-16);
            min-height: 44px;
            border: 1px solid var(--color-border-light, #e0e0e0);
            border-radius: var(--radius-sm, 4px);
            background-color: var(--color-surface-regular, #ffffff);
        }

        .profile-page-field:empty::before {
            content: '-';
            color: var(--color-text-secondary, #666);
        }

        .profile-page-rich-text {
            min-height: 120px;
            padding: var(--spacing-16);
        }

        .profile-page-chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-08);
            padding: var(--spacing-12) var(--spacing-16);
            min-height: 44px;
            border: 1px solid var(--color-border-light, #e0e0e0);
            border-radius: var(--radius-sm, 4px);
            background-color: var(--color-surface-regular, #ffffff);
        }

        .profile-page-chips-container:empty::before {
            content: '-';
            color: var(--color-text-secondary, #666);
        }

        .profile-page-chip {
            display: inline-flex;
            align-items: center;
            padding: var(--spacing-08) var(--spacing-12);
            background-color: var(--color-surface-light, #f5f5f5);
            border-radius: var(--radius-sm, 4px);
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
        }

        .profile-page-portfolio-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-12);
            padding: var(--spacing-12) var(--spacing-16);
            min-height: 44px;
            border: 1px solid var(--color-border-light, #e0e0e0);
            border-radius: var(--radius-sm, 4px);
            background-color: var(--color-surface-regular, #ffffff);
        }

        .profile-page-portfolio-container:empty::before {
            content: '-';
            color: var(--color-text-secondary, #666);
        }

        .profile-page-portfolio-item {
            display: flex;
            align-items: center;
            padding: var(--spacing-08) 0;
        }

        .profile-page-portfolio-item__link {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-base);
            color: var(--color-primary, #007AFF);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .profile-page-portfolio-item__link:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        /* Cost Edit Level */
        .cost-edit-level {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }
        
        .cost-edit-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-12, 12px);
        }

        /* Team cost display para teams publicados */
        .team-cost-display {
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            font-size: 16px;
            font-weight: 800;
            color: var(--color-text-primary, #0a243f);
            line-height: 1.5;
        }

        .team-cost-display span {
            font-weight: 400;
        }

        .team-cost-group {
            flex: 1;
            max-width: 839px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }


        /* Secondary Action Levels */
        .secondary-actions {
            display: flex;
            align-items: center;
            gap: 32px;
            /* justify-content: space-between; */
            margin-bottom: 16px;
        }
        
        /* Estado deshabilitado de secondary-actions */
        .secondary-actions.disabled {
            opacity: 0.5;
            pointer-events: none;
            user-select: none;
        }
        
        .secondary-actions.disabled * {
            cursor: not-allowed !important;
        }
        
        .secondary-actions.disabled input,
        .secondary-actions.disabled button {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-input-group {
            flex: 1;
        }
        
        /* Input Buscador - Override width para create_team */
        .search-input-group.dsu-input-buscador {
            /* width: 100%; */
            /* max-width: 840px; */
        }
        
        .search-input-group.dsu-input-buscador .dsu-input {
            /* max-width: 840px; */
        }

        .view-controls {
            display: flex;
            gap: 0;
            align-items: center;
        }

        .view-control-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-surface-regular, #ffffff);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-family-secondary, 'Lato');
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text-primary, #0a243f);
        }

        .view-control-btn:hover {
            opacity: 0.8;
        }

        .view-control-btn.active {
            background-color: var(--color-surface-especial, #f4f7fb);
        }

        .view-control-btn img,
        .view-control-btn .btn-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        /* Dark mode icon adjustment for view controls */
        [data-theme="dark"] .view-controls .view-control-btn img,
        [data-theme="dark"] .view-controls .view-control-btn .btn-icon {
            filter: brightness(0) saturate(100%) invert(1);
        }

        /* Associated Projects */
        .associated-projects-group {
            max-width: 73%;
        }
        
        /* Chips Container */
        .projects-chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-08);
            margin-top: var(--spacing-12);
            min-height: 24px;
        }

            height: 120px;

        .team-members-grid.list-view .dsu-profile-card__content {

            gap: var(--spacing-08);

        .team-members-grid.list-view .dsu-profile-card__contact {

            gap: var(--spacing-24);

        /* Sticky Buttons - Usando design system, ajuste de centrado */
        .dsu-sticky-buttons {
            display: flex;
            gap: var(--spacing-24);
            align-items: flex-start;
            padding: var(--spacing-24);
            border-top: 1px solid var(--color-status-disabled);
            background-color: var(--color-surface-regular);
            width: 100%;
            box-sizing: border-box;
            position: sticky;
            bottom: 0;
            z-index: 2000;
            justify-content: center;
        }

        .dsu-sticky-buttons__wrapper {
            display: flex;
            gap: var(--spacing-24);
            align-items: flex-start;
            flex: 1;
            justify-content: center;
            max-width: 80%;
            margin: 0 auto;

        /* Team Description Section */

            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
            width: 100%;
            margin-top: var(--spacing-24);
        }

        .team-description-header {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-08);
            width: 100%;

        .team-description-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            padding: var(--spacing-08) 0;
            transition: all 0.3s ease;

        .team-description-section-title:hover {

        }

        .team-description-section-title__text {
            font-family: var(--font-family-secondary);
            font-size: 24px;
            font-weight: var(--font-weight-black);

            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: var(--spacing-12);
            transition: transform 0.2s ease;
        }

        .team-description-section-title__chevron img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Dark mode icon adjustment */
        [data-theme="dark"] .team-description-section-title__chevron img {

        }

            transform: rotate(0deg);
        }

        .team-description-section-title--expanded .team-description-section-title__chevron {
            transform: rotate(180deg);
        }

        .team-description-section-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .team-description-section-content:not(.team-description-section-content--expanded) {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

            padding: var(--spacing-08) 0;

        /* Team Assets Section */
        .team-assets-section {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
            width: 100%;
            margin-top: var(--spacing-24);
        }

        .team-assets-header {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-08);
            width: 100%;
        }

        .team-assets-content {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-16);
            width: 100%;
        }

        .team-assets-items-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-08);
            width: 100%;
        }

        .team-assets-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-12);
            padding: var(--spacing-12) var(--spacing-16);
            background-color: var(--color-surface-regular);
            border: 1px solid var(--color-status-disabled);
            border-radius: var(--radius-md);
        }

        .team-assets-item-preview {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            object-fit: cover;
            flex-shrink: 0;
        }

        .team-assets-item-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-status-disabled);
            border-radius: var(--radius-md);
            flex-shrink: 0;
            position: relative;
        }

        .team-assets-item-icon img {
            width: 24px;
            height: 24px;
        }

        .team-assets-item-preview-wrapper {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            overflow: hidden;
            flex-shrink: 0;
        }

        .team-assets-item-preview--pdf {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        .team-assets-item-preview-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            padding: 2px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .team-assets-item-preview-label {
            color: white;
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .team-assets-item-icon-extension {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 7px;
            font-weight: 600;
            color: var(--color-text-primary);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 1px 3px;
            border-radius: 2px;
            line-height: 1;
        }

        .team-assets-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-04);
        }

        .team-assets-item-text {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
            margin: 0;
            word-break: break-word;
        }

        .team-assets-item-link {
            font-family: var(--font-family-secondary);
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            margin: 0;
            word-break: break-all;
        }

        .team-assets-item-link a {
            color: var(--color-text-secondary);
            text-decoration: none;
        }

        .team-assets-item-link a:hover {
            text-decoration: underline;
        }

        /* Dark mode adjustments */
        [data-theme="dark"] .team-description-section-title__text,
        [data-theme="dark"] .team-description-display {
            color: var(--color-text-primary-dark);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .team-content-wrapper {
                margin-left: 0;
            }

            .team-content {
                padding: 24px 16px;
            }

            .dsu-sticky-buttons {
                padding: var(--spacing-16);
                flex-direction: column;
            }
        }
    </style>
</head>

    <script>
        // ============================================
        // Helper function para obtener imagen (IndexedDB o base64)
        // ============================================
        async function getMemberImage(memberImageRef) {
            if (!memberImageRef || memberImageRef.trim() === '') {
                return 'images/avatar_icon.svg';
            }
            
            // Si es referencia de IndexedDB
            if (memberImageRef.startsWith('indexeddb:')) {
                const imageId = memberImageRef.replace('indexeddb:', '');
                if (typeof DocuImageStorage !== 'undefined' && DocuImageStorage.isAvailable()) {
                    try {
                        const imageData = await DocuImageStorage.getImage(imageId);
                        return imageData || 'images/avatar_icon.svg';
                    } catch (error) {
                        console.error('❌ Error al cargar imagen de IndexedDB:', error);
                        return 'images/avatar_icon.svg';
                    }
                } else {
                    console.warn('⚠️ IndexedDB no disponible');
                    return 'images/avatar_icon.svg';
                }
            }
            
            // Si es base64, retornar directamente
            if (memberImageRef.startsWith('data:')) {
                return memberImageRef;
            }
            
            // Fallback
            return 'images/avatar_icon.svg';
        }
        
        // ============================================
        // Theme Management (Light/Dark Mode)
        // ============================================
        
        // Function to toggle theme
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            
            // Save preference to localStorage
            try {
                localStorage.setItem('theme', newTheme);
            } catch (error) {
                console.warn('⚠️ No se pudo guardar el tema:', error);
            }
            
            // Update dark mode button icon and text
            updateThemeButton(newTheme);
        }
        
        // Function to update theme button icon and text
        function updateThemeButton(theme) {
            const darkModeBtn = document.getElementById('darkModeBtn');
            if (!darkModeBtn) return;
            
            const icon = darkModeBtn.querySelector('.dsu-nav-button__icon img');
            const text = darkModeBtn.querySelector('.dsu-nav-button__text');
            
            if (icon) {
                icon.src = theme === 'dark' ? 'images/sun.svg' : 'images/moon.svg';
                icon.alt = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
            }
            
            if (text) {
                text.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
            }
        }
        
        // Function to load saved theme
        function loadTheme() {
            try {
                const savedTheme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateThemeButton(savedTheme);
            } catch (error) {
                console.warn('⚠️ No se pudo cargar el tema:', error);
                document.documentElement.setAttribute('data-theme', 'light');
            }
        }
        
        // Initialize theme immediately (before DOMContentLoaded to prevent flash)
        loadTheme();

        // ============================================
        // Initialize sidebar state immediately on page load (before any other initialization)
        // ============================================
        function initSidebarState() {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggleIcon = document.getElementById('sidebarToggleIcon');
            const sidebarLogo = sidebar ? sidebar.querySelector('.dsu-sidebar__logo img') : null;
            
            if (sidebar) {

                const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
                if (isCollapsed) {

                    if (sidebarToggleIcon) {

                        sidebarLogo.src = 'images/logo_icon.svg';

                setTimeout(function() {
                    sidebar.classList.add('sidebar-initialized');

        /**
         * Guarda el estado de las secciones colapsables
         */
        function saveSectionsState() {
            try {
                // Obtener el ID del team actual
                const urlParams = new URLSearchParams(window.location.search);
                const teamId = urlParams.get('id') || sessionStorage.getItem('docu_selected_team_id');
                
                if (!teamId) {
                    console.warn('⚠️ No hay team ID para guardar estado de secciones');
                    return;
                }

                const descriptionSectionTitle = document.querySelector('#teamDescriptionSection .team-description-section-title');
                const missionSectionTitle = document.querySelector('#teamMissionSection .team-description-section-title');
                
                const sectionsState = {
                    descriptionExpanded: descriptionSectionTitle ? descriptionSectionTitle.classList.contains('team-description-section-title--expanded') : true,
                    missionExpanded: missionSectionTitle ? missionSectionTitle.classList.contains('team-description-section-title--expanded') : true
                };

                // Obtener datos del proyecto
                const projectData = DocuProjectData.getProjectData();
                if (!projectData || !projectData.teams) {
                    console.warn('⚠️ No hay datos del proyecto para guardar estado');
                    return;
                }

                // Buscar el team y actualizar su estado
                const team = projectData.teams.find(t => String(t.id) === String(teamId));
                if (team) {
                    if (!team.sectionsState) {
                        team.sectionsState = {};
                    }
                    team.sectionsState = sectionsState;
                    team.updatedAt = Date.now();

                    // Guardar los cambios
                    DocuProjectData.saveProjectData(projectData);
                    console.log('✅ Estado de secciones guardado');
                }
            } catch (error) {
                console.warn('⚠️ Error al guardar estado de secciones:', error);
            }
        }

            // Edit group
            const editGroupBtn = document.getElementById('editGroupBtn');

        /**
         * Elimina el proyecto actual
         */
        function deleteProject() {
            console.log('🗑️ === INICIO deleteProject ===');
            
            // Obtener el ID del proyecto desde la URL o sessionStorage
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('projectId') || sessionStorage.getItem('docu_selected_project_id');
            
            if (!projectId) {
                console.warn('⚠️ No se encontró ID del proyecto para eliminar');
                alert('No se pudo identificar el proyecto a eliminar.');
                return;
            }

            // Obtener información del proyecto para mostrar en la confirmación
            let projectName = 'este proyecto';
            try {
                const project = DocuProjectData.getProjectById(projectId);
                if (project && project.name) {
                    projectName = `"${project.name}"`;
                }
            } catch (error) {
                console.warn('⚠️ Error al obtener información del proyecto:', error);
            }
            
            // Confirmar eliminación
            if (!confirm(`¿Estás seguro de que deseas eliminar ${projectName}?\n\nEsta acción no se puede deshacer.`)) {
                console.log('❌ Usuario canceló la eliminación');
                return;
            }

            console.log('🗑️ Eliminando proyecto:', {
                id: projectId,
                name: projectName
            });

            try {
                // Verificar que DocuProjectData esté disponible
                if (typeof DocuProjectData === 'undefined') {
                    console.error('❌ DocuProjectData no está disponible');
                    alert('Error: No se pudo acceder a los datos del proyecto.');
                    return;
                }

                // Eliminar el proyecto
                const deleted = DocuProjectData.deleteProject(projectId);
                
                if (deleted) {
                    console.log('✅ Proyecto eliminado exitosamente');
                    
                    // Limpiar sessionStorage
                    try {
                        sessionStorage.removeItem('docu_selected_project_id');
                    } catch (error) {
                        console.warn('⚠️ Error al limpiar sessionStorage:', error);
                    }
                    
                    // Redirigir a la página principal o a la lista de proyectos
                    alert(`Proyecto ${projectName} eliminado exitosamente.`);
                    window.location.href = 'index.html'; // O la página que corresponda
                } else {
                    console.error('❌ No se pudo eliminar el proyecto');
                    alert('Error: No se pudo eliminar el proyecto. Puede que no exista o haya ocurrido un error.');
                }
            } catch (error) {
                console.error('❌ Error al eliminar proyecto:', error);
                alert('Error inesperado al eliminar el proyecto. Por favor, inténtalo de nuevo.');
            }
        }

        /**
         * Carga los datos del team publicado
         */
        function loadPublishedTeamData() {
            try {
                // Intentar obtener el team ID de la URL o sessionStorage
                const urlParams = new URLSearchParams(window.location.search);
                const teamId = urlParams.get('id') || sessionStorage.getItem('docu_selected_team_id');
                
                if (!teamId) {
                    console.log('ℹ️ No hay team ID en URL o sessionStorage, cargando el más reciente');
                    // Cargar el team publicado más reciente
                    const projectData = DocuProjectData.getProjectData();
                    if (projectData && projectData.teams && Array.isArray(projectData.teams)) {
                        const publishedTeams = projectData.teams.filter(t => 
                            t.status === 'published' && 
                            t.name && 
                            t.name.trim().length > 0
                        );
                        
                        if (publishedTeams.length > 0) {
                            const latestTeam = publishedTeams.sort((a, b) => {
                                const dateA = a.publishedAt || a.updatedAt || a.createdAt || 0;
                                const dateB = b.publishedAt || b.updatedAt || b.createdAt || 0;
                                return dateB - dateA;
                            })[0];
                            
                            displayTeamData(latestTeam).catch(err => console.error('Error al mostrar team:', err));
                        }
                    }
                    return;
                }

                // Cargar el team específico (forzar recarga de datos para obtener la versión más reciente)
                // Limpiar caché forzando una nueva lectura desde localStorage
                console.log('🔍 Buscando team con ID:', teamId);
                let projectData = DocuProjectData.getProjectData();
                console.log('📦 Datos obtenidos, total teams:', projectData?.teams?.length || 0);
                
                if (projectData && projectData.teams && Array.isArray(projectData.teams)) {
                    // Buscar el team con el ID exacto (comparar como strings para evitar problemas de tipo)
                    const team = projectData.teams.find(t => {
                        const tId = String(t.id || '');
                        const searchId = String(teamId || '');
                        const matches = tId === searchId;
                        if (matches && t.status === 'published') {
                            console.log('✅ Team encontrado:', { id: t.id, name: t.name, status: t.status });
                        }
                        return matches && t.status === 'published';
                    });
                    if (team) {
                        console.log('✅ Team encontrado, cargando datos actualizados:', {
                            id: team.id,
                            name: team.name,
                            projectsCount: team.projects ? team.projects.length : 0,
                            projects: team.projects,
                            projectsArray: team.projects ? JSON.stringify(team.projects) : 'null/undefined'
                        });
                        // Usar una copia fresca de los datos del team para asegurar que tenemos la versión más reciente
                        const freshTeamData = { ...team };
                        // Asegurar que projects sea un array válido
                        if (!freshTeamData.projects || !Array.isArray(freshTeamData.projects)) {
                            freshTeamData.projects = [];
                            console.warn('⚠️ Team.projects no es un array válido, inicializando como array vacío');
                        }
                        displayTeamData(freshTeamData).catch(err => console.error('Error al mostrar team:', err));
                        // Marcar el team como activo en el sidebar después de cargar la lista
                        setTimeout(() => {
                            const teamsList = document.getElementById('teamsList');
                            if (teamsList) {
                                const teamItem = teamsList.querySelector(`[data-team-id="${teamId}"]`);
                                if (teamItem) {
                                    // Remover active de todos los items
                                    teamsList.querySelectorAll('.dsu-team-item').forEach(item => {
                                        item.classList.remove('dsu-team-item--active', 'active');
                                    });
                                    // Agregar active al item del team actual
                                    teamItem.classList.add('dsu-team-item--active', 'active');
                                }
                            }
                        }, 800);
                    } else {
                        console.warn('⚠️ Team no encontrado o no está publicado');
                    }
                }
            } catch (error) {
                console.error('❌ Error al cargar datos del team:', error);
            }
        }

        /**
         * Muestra los datos del team en la vista
         */
        async function displayTeamData(teamData) {
            console.log('📦 Cargando datos del team:', {
                id: teamData.id,
                name: teamData.name,
                membersCount: teamData.members ? teamData.members.length : 0,
                members: teamData.members ? teamData.members.map(m => ({
                    id: m.id,
                    name: m.name,
                    hasImage: !!(m.image || m.avatar),
                    imageType: m.image ? 'image' : (m.avatar ? 'avatar' : 'none')
                })) : []
            });
            
            // Mostrar nombre del team
            const projectNameDisplay = document.getElementById('projectNameDisplay');
            if (projectNameDisplay && teamData.name) {
                projectNameDisplay.textContent = teamData.name;
            }

            // Mostrar team cost
            const teamCostDisplay = document.querySelector('.team-cost-display');
            if (teamCostDisplay) {
                let teamCostValue = 'USD 0.00';
                
                // Si hay teamCost guardado y no está vacío, usarlo
                if (teamData.teamCost && teamData.teamCost.trim() !== '') {
                    teamCostValue = teamData.teamCost;
                } else {
                    // Si no hay teamCost guardado, calcularlo desde los miembros
                    let totalCost = 0;
                    if (teamData.members && Array.isArray(teamData.members)) {
                        teamData.members.forEach(member => {
                            const cost = member.cost || '';
                            if (cost) {
                                // Remover cualquier carácter no numérico excepto punto decimal
                                const numericValue = parseFloat(cost.replace(/[^\d.]/g, ''));
                                if (!isNaN(numericValue)) {
                                    totalCost += numericValue;
                                }
                            }
                        });
                    }
                    teamCostValue = `USD ${totalCost.toFixed(2)}`;
                }
                
                teamCostDisplay.innerHTML = `<span>Team cost: </span>${teamCostValue}`;
            }

            // Mostrar descripción del team
            const teamDescriptionDisplay = document.getElementById('teamDescriptionDisplay');
            const teamDescriptionSection = document.getElementById('teamDescriptionSection');
            const descriptionSectionTitle = teamDescriptionSection ? teamDescriptionSection.querySelector('.team-description-section-title') : null;
            const descriptionSectionContent = teamDescriptionSection ? teamDescriptionSection.querySelector('.team-description-section-content') : null;
            
            if (teamDescriptionDisplay && teamDescriptionSection) {
                if (teamData.description && teamData.description.trim() !== '') {
                    teamDescriptionDisplay.innerHTML = teamData.description;
                    teamDescriptionSection.style.display = 'flex'; // Mostrar sección
                    
                    // Restaurar estado colapsado/expandido
                    if (teamData.sectionsState && teamData.sectionsState.descriptionExpanded !== false) {
                        if (descriptionSectionTitle) descriptionSectionTitle.classList.add('team-description-section-title--expanded');
                        if (descriptionSectionContent) descriptionSectionContent.classList.add('team-description-section-content--expanded');
                    } else {
                        if (descriptionSectionTitle) descriptionSectionTitle.classList.remove('team-description-section-title--expanded');
                        if (descriptionSectionContent) descriptionSectionContent.classList.remove('team-description-section-content--expanded');
                    }
                    
                    console.log('✅ Descripción del team mostrada');
                } else {
                    teamDescriptionDisplay.innerHTML = '';
                    teamDescriptionSection.style.display = 'none'; // Ocultar sección si no hay descripción
                }
            }

            // Mostrar misión del team
            const teamMissionDisplay = document.getElementById('teamMissionDisplay');
            const teamMissionSection = document.getElementById('teamMissionSection');
            const missionSectionTitle = teamMissionSection ? teamMissionSection.querySelector('.team-description-section-title') : null;
            const missionSectionContent = teamMissionSection ? teamMissionSection.querySelector('.team-description-section-content') : null;
            
            if (teamMissionDisplay && teamMissionSection) {
                if (teamData.mission && teamData.mission.trim() !== '') {
                    teamMissionDisplay.innerHTML = teamData.mission;
                    teamMissionSection.style.display = 'flex'; // Mostrar sección
                    
                    // Restaurar estado colapsado/expandido
                    if (teamData.sectionsState && teamData.sectionsState.missionExpanded !== false) {
                        if (missionSectionTitle) missionSectionTitle.classList.add('team-description-section-title--expanded');
                        if (missionSectionContent) missionSectionContent.classList.add('team-description-section-content--expanded');
                    } else {
                        if (missionSectionTitle) missionSectionTitle.classList.remove('team-description-section-title--expanded');
                        if (missionSectionContent) missionSectionContent.classList.remove('team-description-section-content--expanded');
                    }
                    
                    console.log('✅ Misión del team mostrada');
                } else {
                    teamMissionDisplay.innerHTML = '';
                    teamMissionSection.style.display = 'none'; // Ocultar sección si no hay misión
                }
            }

            // Mostrar assets del team
            const teamAssetsItemsContainer = document.getElementById('teamAssetsItemsContainer');
            const teamAssetsSection = document.getElementById('teamAssetsSection');
            const assetsSectionTitle = teamAssetsSection ? teamAssetsSection.querySelector('.team-description-section-title[data-section="teamAssets"]') : null;
            const assetsSectionContent = teamAssetsSection ? teamAssetsSection.querySelector('.team-description-section-content[data-content="teamAssets"]') : null;
            
            if (teamAssetsItemsContainer && teamAssetsSection) {
                if (teamData.assets && Array.isArray(teamData.assets) && teamData.assets.length > 0) {
                    teamAssetsItemsContainer.innerHTML = '';
                    
                    teamData.assets.forEach(asset => {
                        const item = document.createElement('div');
                        item.className = 'team-assets-item';
                        
                        let previewHtml = '';
                        let contentHtml = '';
                        
                        if (asset.type === 'image' && asset.preview) {
                            previewHtml = `<img src="${asset.preview}" alt="${asset.name}" class="team-assets-item-preview" data-preview-src="${asset.preview}" data-preview-name="${asset.name}">`;
                            contentHtml = `
                                <div class="team-assets-item-content">
                                    <p class="team-assets-item-text">${escapeHtml(asset.name)}</p>
                                    <p class="team-assets-item-link">${escapeHtml(asset.size || '')}</p>
                                </div>
                            `;
                        } else if (asset.type === 'file' && asset.name) {
                            const fileExtension = asset.fileExtension || asset.name.split('.').pop().toLowerCase();
                            const isPDF = fileExtension === 'pdf' || (asset.preview && asset.preview.includes('data:application/pdf'));
                            
                            if (isPDF && asset.preview) {
                                previewHtml = `
                                    <div class="team-assets-item-preview-wrapper" data-pdf-src="${asset.preview}" data-file-name="${escapeHtml(asset.name)}">
                                        <iframe src="${asset.preview}" class="team-assets-item-preview team-assets-item-preview--pdf" title="${escapeHtml(asset.name)}"></iframe>
                                        <div class="team-assets-item-preview-overlay">
                                            <span class="team-assets-item-preview-label">PDF</span>
                                        </div>
                                    </div>
                                `;
                            } else {
                                const documentIcons = {

                                    'xlsx': 'xls',
                                    'ppt': 'ppt',
                                    'pptx': 'ppt',
                                    'txt': 'txt',
                                    'csv': 'csv'
                                };
                                const iconType = documentIcons[fileExtension] || 'file';
                                const iconClass = iconType !== 'file' ? `team-assets-item-icon--${iconType}` : '';
                                
                                previewHtml = `
                                    <div class="team-assets-item-icon ${iconClass}" data-file-name="${escapeHtml(asset.name)}" data-file-size="${escapeHtml(asset.size || '')}" data-file-extension="${fileExtension}">
                                        <img src="images/attachment.svg" alt="${iconType.toUpperCase()}" title="${fileExtension.toUpperCase()}">
                                        ${iconType !== 'file' ? `<span class="team-assets-item-icon-extension">${fileExtension.toUpperCase()}</span>` : ''}
                                    </div>
                                `;
                            }
                            
                            contentHtml = `
                                <div class="team-assets-item-content">
                                    <p class="team-assets-item-text">${escapeHtml(asset.name)}</p>
                                    <p class="team-assets-item-link">${escapeHtml(asset.size || '')}</p>

                                    <img src="images/link.svg" alt="Link">
                                </div>
                            `;
                            contentHtml = `
                                <div class="team-assets-item-content">
                                    <p class="team-assets-item-text">${escapeHtml(asset.name || asset.url)}</p>
                                    <a href="${escapeHtml(asset.url)}" target="_blank" class="team-assets-item-link">${escapeHtml(asset.url)}</a>
                                </div>
                            `;
                        } else if (asset.type === 'text' && asset.text) {
                            previewHtml = '';
                            contentHtml = `
                                <div class="team-assets-item-content">
                                    <p class="team-assets-item-text">-${escapeHtml(asset.text)}</p>
                                </div>
                            `;
                        }
                        
                        item.innerHTML = `${previewHtml}${contentHtml}`;
                        teamAssetsItemsContainer.appendChild(item);
                    });
                    
                    teamAssetsSection.style.display = 'flex'; // Mostrar sección
                    
                    // Restaurar estado colapsado/expandido
                    if (teamData.sectionsState && teamData.sectionsState.assetsExpanded !== false) {

            // Mostrar associated projects (chips)
            const chipsContainer = document.getElementById('projectsChipsContainer');

                chipsContainer: !!chipsContainer,
                hasProjects: !!(teamData.projects),
                isArray: Array.isArray(teamData.projects),
                projectsCount: teamData.projects ? teamData.projects.length : 0,
                projects: teamData.projects
            });
            
            if (chipsContainer) {
                chipsContainer.innerHTML = '';

                const projectsArray = teamData.projects && Array.isArray(teamData.projects) ? teamData.projects : [];
                
                if (projectsArray.length > 0) {
                    console.log('📋 Procesando', projectsArray.length, 'proyectos asociados');
                    let chipsAgregados = 0;
                    
                    projectsArray.forEach((project, index) => {

                        let projectName = null;
                        if (typeof project === 'string') {
                            projectName = project.trim();
                        } else if (project && typeof project === 'object' && project.name) {
                            projectName = String(project.name).trim();
                        }
                        
                        if (projectName && projectName.length > 0) {

                for (const member of teamData.members) {

                    membersGrid.insertAdjacentHTML('beforeend', memberCard);

            }

        /**
         * Crea el HTML para una tarjeta de miembro (async para IndexedDB)
         */
        async function createMemberCardHTML(member) {
            // Usar member.image (consistente con create_team.html)
            // También verificar member.avatar como fallback para compatibilidad
            const memberImage = member.image || member.avatar || '';
            const memberName = escapeHtml(member.name || '');
            const memberLastName = escapeHtml(member.lastName || '');
            const memberJob = escapeHtml(member.jobPosition || '');
            const memberEmail = escapeHtml(member.email || '');
            const memberPhone = escapeHtml(member.phone || '');
            
            // Obtener imagen desde IndexedDB o base64
            const imageSrc = await getMemberImage(memberImage);
            const imageAlt = memberImage ? `${escapeHtml(memberName)} ${escapeHtml(memberLastName || '')}`.trim() : 'Avatar';
            const imageClass = 'dsu-profile-card__image';
            
            console.log('📷 Creando card para miembro:', {
                id: member.id,
                name: memberName,
                hasImage: !!memberImage,
                imageType: memberImage.startsWith('indexeddb:') ? 'IndexedDB' : memberImage.startsWith('data:') ? 'base64' : 'none'
            });
            
            // En la vista publicada NO mostrar el botón de editar
            return `
                <div class="dsu-profile-card" data-member-id="${member.id || ''}">
                    <div class="dsu-profile-card__image-wrapper">
                        <img src="${escapeHtml(imageSrc)}" alt="${escapeHtml(imageAlt)}" class="${imageClass}">
                    </div>
                    <div class="dsu-profile-card__content">
                        <div class="dsu-profile-card__name-job">
                            <p class="dsu-profile-card__name">${escapeHtml(memberName)} ${escapeHtml(memberLastName || '')}</p>
                            <p class="dsu-profile-card__job">${escapeHtml(memberJob || 'Job position')}</p>
                        </div>
                        <div class="dsu-profile-card__contact">
                            ${memberEmail ? `<div class="dsu-profile-card__contact-item">
                                <img src="images/mail.svg" alt="Email" class="dsu-profile-card__contact-icon">
                                <a href="mailto:${escapeHtml(memberEmail)}" class="dsu-profile-card__contact-text dsu-profile-card__contact-link">${escapeHtml(memberEmail)}</a>
                            </div>` : ''}
                            ${memberPhone ? `<div class="dsu-profile-card__contact-item">
                                <img src="images/chat.svg" alt="Contact" class="dsu-profile-card__contact-icon">
                                <p class="dsu-profile-card__contact-text">${escapeHtml(memberPhone)}</p>
                            </div>` : ''}
                        </div>
                    </div>
                </div>`;
        }

        /**
         * Escapa HTML para prevenir XSS
         */
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * Attach click listeners to profile cards to open profile page
         */
        function attachProfileCardListeners() {
            const profileCards = document.querySelectorAll('.dsu-profile-card');
            profileCards.forEach(card => {
                const memberId = card.getAttribute('data-member-id');
                if (!memberId) return;
                
                // Get image and name elements
                const imageWrapper = card.querySelector('.dsu-profile-card__image-wrapper');
                const nameElement = card.querySelector('.dsu-profile-card__name');
                
                // Add click listener to image
                if (imageWrapper) {
                    imageWrapper.style.cursor = 'pointer';
                    imageWrapper.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        openMemberProfilePage(memberId);
                    });
                }
                
                // Add click listener to name
                if (nameElement) {
                    nameElement.style.cursor = 'pointer';
                    nameElement.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        openMemberProfilePage(memberId);
                    });
                }
            });
        }
        
        /**

         */
        function openMemberProfilePage(memberId) {
            if (!memberId) return;
            
            // Redirect to member profile page with member ID
            window.location.href = `member_profile.html?id=${encodeURIComponent(memberId)}`;
        }

        // ============================================
        // Auto-save functionality
        // ============================================
        function autoSave() {
            // NO hacer autosave si estamos viendo un team publicado sin modificar
            // Solo hacer autosave si hay cambios no guardados en un draft o nuevo team
            if (!currentProjectId || !currentProjectData) {
                // Si no hay team cargado, puede ser un nuevo team o un draft nuevo
                const projectName = document.getElementById('projectName')?.value.trim();
                
                if (projectName || membersList.length > 0) {
                    const projectData = getFormData();
                    projectData.status = 'draft';
                    
                    if (!currentProjectId) {
                        currentProjectId = Date.now().toString();
                    }
                    
                    saveProjectToStorage(currentProjectId, projectData);
                    console.log('💾 Auto-save realizado (nuevo team/draft)');
                }
                return;
            }
            
            // Si hay team cargado, verificar si es un draft
            // Solo hacer autosave si es un draft y hay cambios
            if (currentProjectData && currentProjectData.status === 'draft') {
                const projectName = document.getElementById('projectName')?.value.trim();
                
                if (projectName || membersList.length > 0) {
                    // Verificar si hay cambios antes de guardar
                    const currentData = getFormData();
                    const hasChanges = 
                        currentData.name !== (currentProjectData.name || '') ||
                        currentData.teamCost !== (currentProjectData.teamCost || '') ||
                        JSON.stringify(currentData.projects) !== JSON.stringify(currentProjectData.projects || []) ||
                        JSON.stringify(currentData.members) !== JSON.stringify(currentProjectData.members || []);
                    
                    if (hasChanges) {
                        currentData.status = 'draft';
                        currentData.id = currentProjectId;
                        saveProjectToStorage(currentProjectId, currentData);
                        console.log('💾 Auto-save realizado (draft con cambios)');
                    }
                }
            } else {
                // Si es un team publicado, NO hacer autosave automático
                // El usuario debe hacer cambios explícitos para guardar
                console.log('ℹ️ Auto-save omitido: team publicado (no se autoguardan teams publicados)');
            }
        }

        // ============================================
        // Form Functionality
        // ============================================
        let currentProjectId = null;
        let currentProjectData = null;

        function initFormFunctionality() {
            const projectNameInput = document.getElementById('projectName');
            const publishBtn = document.getElementById('publishBtn');
            const saveDraftBtn = document.getElementById('saveDraftBtn');

            // Validación: Habilitar/deshabilitar botón Publish
            // El botón Share team permanece siempre deshabilitado en esta pantalla
            projectNameInput.addEventListener('input', function() {
                const hasProjectName = projectNameInput.value.trim().length > 0;
                publishBtn.disabled = !hasProjectName;
                
                // Guardar automáticamente cuando se escribe el nombre
                if (hasProjectName) {
                    autoSave();
                }
            });

            // Save Draft
            saveDraftBtn.addEventListener('click', function() {
                saveDraft();
            });

            // Publish
            publishBtn.addEventListener('click', function() {
                publishProject();
            });
        }

        function saveDraft() {
            const projectData = getFormData();
            projectData.status = 'draft';
            
            if (!currentProjectId) {
                currentProjectId = Date.now().toString();
            }

            saveProjectToStorage(currentProjectId, projectData);
            console.log('Draft guardado');
        }

        function publishProject() {
            console.log('=== INICIO publishProject ===');
            
            const projectName = document.getElementById('projectName').value.trim();
            
            if (!projectName) {
                alert('Por favor, ingresa un nombre para el proyecto');
                return;
            }

            console.log('✅ Nombre del proyecto válido:', projectName);

            const projectData = getFormData();
            projectData.name = projectName;
            projectData.status = 'published';
            projectData.publishedAt = Date.now();

            if (!currentProjectId) {
                currentProjectId = Date.now().toString();
            }

            projectData.id = currentProjectId;
            projectData.createdAt = currentProjectId;
            projectData.updatedAt = Date.now();

            console.log('📦 Datos del proyecto preparados:', projectData);
            console.log('🆔 ID del proyecto:', currentProjectId);
            
            // Verificar que los chips están incluidos en projectData
            if (projectData.projects && Array.isArray(projectData.projects)) {
                console.log('✅ Chips incluidos en projectData:', projectData.projects.length, 'chips');
                console.log('📋 Chips:', projectData.projects);
            } else {
                console.warn('⚠️ No se encontraron chips en projectData antes de guardar');
                console.log('📦 projectData completo:', projectData);
            }

            // Guardar proyecto
            console.log('💾 Guardando proyecto...');
            const saved = saveProjectToStorage(currentProjectId, projectData);
            
            if (!saved) {
                console.error('❌ Error al guardar el proyecto');
                alert('Error al guardar el proyecto. Por favor, intenta de nuevo.');
                return;
            }
            
            console.log('✅ Proyecto guardado exitosamente');

            // Agregar al sidebar con múltiples reintentos para asegurar persistencia
            console.log('📋 Actualizando sidebar...');
            
            // Función para recargar el sidebar con verificación
            const reloadSidebarWithVerification = (attempt = 1, maxAttempts = 5) => {
