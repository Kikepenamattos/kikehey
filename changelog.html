    <script>
        let allCommits = [];

        // Función para formatear fecha
        function formatDate(dateString) {
            // Manejar formato ISO con timezone: "2025-11-01 07:20:48 -0500"
            let date;
            
            // Intentar parsear formato de git log
            const gitLogMatch = dateString.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})\s+([+-]\d{4})$/);
            if (gitLogMatch) {
                const [, year, month, day, hour, minute, second, timezone] = gitLogMatch;
                const tzSign = timezone[0];
                const tzHours = parseInt(timezone.substring(1, 3));
                const tzMinutes = parseInt(timezone.substring(3));
                const tzOffset = (tzSign === '+' ? 1 : -1) * (tzHours * 60 + tzMinutes);
                
                // Crear fecha en UTC y ajustar por timezone
                date = new Date(Date.UTC(
                    parseInt(year),
                    parseInt(month) - 1,
                    parseInt(day),
                    parseInt(hour),
                    parseInt(minute),
                    parseInt(second)
                ));
                
                // Ajustar por el offset del timezone (convertir minutos a milisegundos)
                date.setUTCMinutes(date.getUTCMinutes() - tzOffset);
            } else {
                // Intentar parsear como ISO string estándar
                date = new Date(dateString);
            }
            
            if (isNaN(date.getTime())) {
                date = new Date(); // Fallback a fecha actual
            }
            
            const now = new Date();
            const diff = now - date;
            
            // Formato completo: "3 de noviembre de 2025, 19:50"
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            };
            const fullDate = date.toLocaleDateString('es-ES', options);
            
            // Tiempo relativo
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            const months = Math.floor(days / 30);
            const years = Math.floor(days / 365);

            let relativeTime = '';
            if (years > 0) {
                relativeTime = `hace ${years} año${years > 1 ? 's' : ''}`;
            } else if (months > 0) {
                relativeTime = `hace ${months} mes${months > 1 ? 'es' : ''}`;
            } else if (days > 0) {
                relativeTime = `hace ${days} día${days > 1 ? 's' : ''}`;
            } else if (hours > 0) {
                relativeTime = `hace ${hours} hora${hours > 1 ? 's' : ''}`;
            } else if (minutes > 0) {
                relativeTime = `hace ${minutes} minuto${minutes > 1 ? 's' : ''}`;
            } else {
                relativeTime = 'hace unos segundos';
            }

            return {
                full: fullDate,
                relative: relativeTime
            };
        }

        // Función para obtener iniciales del autor
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        // Función para obtener commits (simulando, ya que no podemos ejecutar git directamente)
        async function fetchCommits() {
            // En un entorno real, esto haría una llamada a una API o ejecutaría git log
            // Por ahora, vamos a usar un enfoque que intente leer el historial
            
            try {
                // Intentar hacer fetch desde el repositorio git
                const response = await fetch('.git/logs/HEAD');
                if (response.ok) {
                    // Procesar logs si están disponibles
                }
            } catch (e) {
                // Si no está disponible, usar datos del servidor o localStorage
            }
            
            // Por ahora, retornar estructura vacía - se poblará con loadChangelog
            return [];
        }

        // Función para cargar el historial - Crea una card por cada commit encontrado
        async function loadChangelog() {
            const container = document.getElementById('changelogContainer');
            container.innerHTML = '<div class="loading">Cargando historial de cambios...</div>';

            const timestamp = new Date().getTime();
            const githubUrl = 'https://raw.githubusercontent.com/Kikepenamattos/kikehey/main/git_history.txt';
            
            // Intentar cargar desde ruta local primero
            try {
                const localResponse = await fetch(`git_history.txt?t=${timestamp}`);
                if (localResponse.ok) {
                    const text = await localResponse.text();
                    const commits = parseGitHistory(text);
                    console.log(`📝 Cargados ${commits.length} commits del historial local`);
                    renderCommits(commits);
                    return;
                }
            } catch (error) {
                console.log('No se pudo cargar git_history.txt localmente:', error);
            }
            
            // Si falla local, intentar desde GitHub
            try {
                console.log('Intentando cargar desde GitHub...');
                const githubResponse = await fetch(`${githubUrl}?t=${timestamp}`);
                if (githubResponse.ok) {
                    const text = await githubResponse.text();
                    const commits = parseGitHistory(text);
                    console.log(`📝 Cargados ${commits.length} commits del historial desde GitHub`);
                    renderCommits(commits);
                    return;
                }
            } catch (error) {
                console.log('No se pudo cargar git_history.txt desde GitHub:', error);
            }
            
            // Si ambas fallan, usar datos embebidos
            console.log('Usando datos embebidos como fallback');
            renderCommits(realCommits);
        }
        
        // Función para parsear el historial de git - Cada línea se convierte en una card
        function parseGitHistory(text) {
            if (!text || text.trim().length === 0) {
                console.error('El archivo git_history.txt está vacío');
                return [];
            }
            
            const lines = text.trim().split('\n').filter(line => line.trim());
            console.log(`📄 Procesando ${lines.length} líneas del historial`);
            
            const commits = lines.map((line, index) => {
                const parts = line.split('|');
                if (parts.length >= 5) {
                    // Convertir fecha ISO a formato legible
                    const dateStr = parts[3];
                    return {
                        hash: parts[0].substring(0, 7),
                        fullHash: parts[0],
                        author: parts[1],
                        email: parts[2],
                        date: dateStr,
                        message: parts.slice(4).join('|') // Por si el mensaje tiene |
                    };
                }
                console.warn(`⚠️ Línea ${index + 1} del historial no tiene el formato correcto (${parts.length} partes): ${line.substring(0, 50)}...`);
                return null;
            }).filter(commit => commit !== null);
            
            console.log(`✓ Parseados ${commits.length} commits válidos de ${lines.length} líneas`);
            if (commits.length === 0) {
                console.error('❌ No se encontraron commits válidos en el historial');
            }
            // git log ya devuelve commits de más reciente a más antiguo
            // Mantener ese orden (no hacer reverse)
            return commits;
        }

        // Función para filtrar
        function filterChangelog() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.changelog-item');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(searchTerm) ? 'block' : 'none';
            });
        }

        // Función para refrescar el changelog (fuerza recarga)
        function refreshChangelog() {
            console.log('🔄 Refrescando changelog...');
            loadChangelog();
        }
        
        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📋 Inicializando changelog...');
            loadChangelog();
        });
    </script>
    
    <script>
        // Función para renderizar commits - Crea una card changelog-item por cada commit
        function renderCommits(commits) {
            const container = document.getElementById('changelogContainer');
            
            if (!commits || commits.length === 0) {
                console.warn('⚠️ No hay commits para renderizar');
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>No hay commits en el historial</p>
                        <p style="margin-top: 8px; font-size: 12px; color: #6b7b8a;">Verifica que git_history.txt esté actualizado en el repositorio</p>
                    </div>
                `;
                document.getElementById('totalCommits').textContent = '0';
                return;
            }
            
            console.log(`🎨 Renderizando ${commits.length} commits...`);
            let html = '';
            let cardsCreated = 0;
            
            // Crear una card changelog-item por cada commit en el historial
            commits.forEach((commit, index) => {
                try {
                    const dateInfo = formatDate(commit.date);
                    const initials = getInitials(commit.author);
                    
                    // Crear card changelog-item con toda la información del commit
                    html += `
                        <div class="changelog-item">
                            <div class="changelog-header">
                                <div class="changelog-title">${escapeHtml(commit.message)}</div>
                                <div class="changelog-meta">
                                    <div class="changelog-date">${dateInfo.full}</div>
                                    <div class="changelog-time">${dateInfo.relative}</div>
                                </div>
                            </div>
                            <div class="changelog-author">
                                <div class="changelog-author-info">
                                    <div class="changelog-author-icon">${initials}</div>
                                    <span>${escapeHtml(commit.author)}</span>
                                </div>
                                <span class="changelog-author-email">${escapeHtml(commit.email)}</span>
                            </div>
                            <div class="changelog-hash">${commit.hash || commit.fullHash?.substring(0, 7)}</div>
                        </div>
                    `;
                    cardsCreated++;
                } catch (error) {
                    console.error(`❌ Error al renderizar commit ${index + 1}:`, error, commit);
                }
            });
            
            if (html.length === 0) {
                console.error('❌ No se generó HTML para las cards');
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Error al generar las cards del changelog</p>
                        <p style="margin-top: 8px; font-size: 12px; color: #6b7b8a;">Revisa la consola para más detalles</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = html;
            document.getElementById('totalCommits').textContent = commits.length;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('es-ES');
            allCommits = commits;
            
            console.log(`✅ Se crearon ${cardsCreated} cards changelog-item exitosamente`);
            
            // Verificar que las cards se insertaron en el DOM
            const insertedCards = document.querySelectorAll('.changelog-item');
            if (insertedCards.length !== cardsCreated) {
                console.warn(`⚠️ Advertencia: Se esperaban ${cardsCreated} cards pero se encontraron ${insertedCards.length} en el DOM`);
            } else {
                console.log(`✓ Verificación: ${insertedCards.length} cards encontradas en el DOM`);
            }
        }
