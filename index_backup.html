<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docu - Iniciar Sesión</title>
    
    <!-- Fuentes personalizadas -->
    <style>
        @font-face {
            font-family: 'Crimson Pro';
            src: url('Fonts/Crimson_Pro/CrimsonPro-VariableFont_wght.ttf') format('truetype');
            font-weight: 200 900;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Crimson Pro';
            src: url('Fonts/Crimson_Pro/CrimsonPro-Italic-VariableFont_wght.ttf') format('truetype');
            font-weight: 200 900;
            font-style: italic;
        }
        
        @font-face {
            font-family: 'Lato';
            src: url('Fonts/Lato/Lato-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lato';
            src: url('Fonts/Lato/Lato-Light.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lato';
            src: url('Fonts/Lato/Lato-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lato';
            src: url('Fonts/Lato/Lato-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Lato';
            src: url('Fonts/Lato/Lato-Black.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }
    </style>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #0a243f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            width: 100%;
            max-width: 424px;
            text-align: center;
        }

        /* Logo según Figma - SOLO el logo, sin texto */
        .logo {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0px;
            gap: 8px;
            width: 133.23px;
            height: 42px;
            flex: none;
            order: 0;
            flex-grow: 0;
        }

        .logo-icon {
            width: 133px;
            height: 42px;
            position: relative;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Texto de bienvenida - Tamaños exactos de Figma */
        .welcome-text {
            margin-bottom: 2rem;
        }

        .welcome-text h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 48px;
            font-weight: 800;
            color: #0a243f;
            margin-bottom: 1rem;
            line-height: 1;
            letter-spacing: 0;
        }

        .welcome-text p {
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: #0a243f;
            line-height: 1.5;
            opacity: 1;
        }

        /* Formulario - Estilos exactos de Figma */
        .login-form {
            text-align: left;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-family: 'Lato', sans-serif;
            font-weight: 800;
            color: #0a243f;
            font-size: 14px;
            text-transform: capitalize;
            letter-spacing: 0;
        }

        .form-group label::after {
            content: " *";
            color: #ff4747;
            font-weight: 800;
        }

        .input-container {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #6b7b8a;
            border-radius: 8px;
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #6b7b8a;
            background-color: #ffffff;
            transition: all 0.3s ease;
            min-height: 48px;
        }

        .form-input:focus {
            outline: none;
            border-color: #0a243f;
            color: #0a243f;
        }

        .form-input::placeholder {
            color: #6b7b8a;
            font-weight: 400;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7b8a;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
            width: 16px;
            height: 16px;
        }

        .password-toggle:hover {
            color: #0a243f;
        }

        /* Botón de login - Primary button según Figma */
        .login-button {
            width: 424px;
            height: 48px;
            padding: 12px 24px;
            background-color: #50dfff;
            color: #0a243f;
            border: none;
            border-radius: 40px;
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-transform: none;
            letter-spacing: 0;
            flex: none;
            order: 2;
            align-self: stretch;
            flex-grow: 0;
        }

        .login-button:hover {
            background-color: #3bc8e6;
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Enlace de registro - Estilo exacto de Figma */
        .signup-link {
            text-align: center;
            margin-bottom: 1rem;
            color: #0a243f;
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
        }

        .signup-link a {
            color: #0a243f;
            text-decoration: underline;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        .signup-link a:hover {
            color: #6b7b8a;
        }

        /* Botón de Google - Estilo exacto de Figma */
        .google-button {
            width: 100%;
            padding: 16px;
            background-color: #ffffff;
            color: #0a243f;
            border: 1px solid #6b7b8a;
            border-radius: 80px;
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            min-height: 48px;
        }

        .google-button:hover {
            background-color: #f9fafb;
            border-color: #0a243f;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        /* Ilustración del barco - Tamaño exacto de Figma */
        .illustration {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
        }

        .boat-illustration {
            width: 424px;
            height: 249.16px;
            position: relative;
        }

        .boat-illustration img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }

            .login-container {
                max-width: 100%;
            }

            .welcome-text h1 {
                font-size: 36px;
            }
            
            .login-button {
                width: 100%;
                max-width: 424px;
            }
            
            .boat-illustration {
                width: 100%;
                height: auto;
                max-width: 424px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo SOLO (sin texto) según Figma -->
        <div class="logo">
            <div class="logo-icon">
                <img src="images/logo.svg" alt="Logo Docu">
            </div>
        </div>

        <!-- Texto de bienvenida -->
        <div class="welcome-text">
            <h1>Easy projects, easy management.</h1>
            <p>Create and manage projects as never before; with simple clicks, great results.</p>
        </div>

        <!-- Formulario de login -->
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email address</label>
                <div class="input-container">
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="hubs@mail.com"
                        value="hubs@mail.com"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="12345"
                        value="12345"
                        required
                    >
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                Log in <span>→</span>
            </button>
        </form>

        <!-- Enlace de registro -->
        <div class="signup-link">
            ¿No tienes una cuenta? <a href="#" id="signupLink">Regístrate</a>
        </div>

        <!-- Botón de Google -->
        <button class="google-button" id="googleButton">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continuar con Google
        </button>

        <!-- Ilustración del barco con tamaño exacto de Figma -->
        <div class="illustration">
            <div class="boat-illustration">
                <img src="images/barco_vector.svg" alt="Ilustración del barco">
            </div>
        </div>
    </div>

    <script>
        class LoginManager {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.emailInput = document.getElementById('email');
                this.passwordInput = document.getElementById('password');
                this.passwordToggle = document.getElementById('passwordToggle');
                this.googleButton = document.getElementById('googleButton');
                this.signupLink = document.getElementById('signupLink');
                
                this.init();
            }

            init() {
                this.bindEvents();
                this.setupPasswordToggle();
            }

            bindEvents() {
                this.form.addEventListener('submit', (e) => this.handleLogin(e));
                this.googleButton.addEventListener('click', () => this.handleGoogleLogin());
                this.signupLink.addEventListener('click', (e) => this.handleSignup(e));
            }

            setupPasswordToggle() {
                this.passwordToggle.addEventListener('click', () => {
                    const type = this.passwordInput.type === 'password' ? 'text' : 'password';
                    this.passwordInput.type = type;
                    
                    // Cambiar icono
                    const svg = this.passwordToggle.querySelector('svg');
                    if (type === 'text') {
                        svg.innerHTML = `
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        `;
                    } else {
                        svg.innerHTML = `
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        `;
                    }
                });
            }

            handleLogin(e) {
                e.preventDefault();
                
                const email = this.emailInput.value.trim();
                const password = this.passwordInput.value.trim();
                
                if (!email || !password) {
                    alert('Por favor completa todos los campos');
                    return;
                }
                
                // Simular proceso de login
                this.showLoading();
                
                setTimeout(() => {
                    // Guardar email para futuras sesiones
                    localStorage.setItem('docu-user-email', email);
                    
                    // Redirigir al dashboard (por ahora mostrar mensaje)
                    alert('¡Login exitoso! Redirigiendo al dashboard...');
                    // window.location.href = 'dashboard.html'; // Cuando creemos el dashboard
                }, 1500);
            }

            handleGoogleLogin() {
                this.showLoading();
                // Aquí implementarías la autenticación real con Google
                setTimeout(() => {
                    alert('¡Login con Google exitoso! Redirigiendo al dashboard...');
                    // window.location.href = 'dashboard.html'; // Cuando creemos el dashboard
                }, 1500);
            }

            handleSignup(e) {
                e.preventDefault();
                // Aquí implementarías la navegación al registro
                alert('Función de registro en desarrollo');
            }

            showLoading() {
                const button = this.form.querySelector('.login-button');
                const originalText = button.innerHTML;
                
                button.innerHTML = 'Iniciando sesión...';
                button.disabled = true;
                button.style.opacity = '0.7';
                
                // Restaurar después de un tiempo
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                    button.style.opacity = '1';
                }, 2000);
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            new LoginManager();
        });
    </script>
</body>
</html>
