        // Función para marcar el proyecto activo
        function markActiveProject() {
            const projectsList = document.getElementById('projectsList');
            if (!projectsList) return;

            // Obtener ID del proyecto desde URL o sessionStorage
            const urlParams = new URLSearchParams(window.location.search);
            const projectIdFromURL = urlParams.get('id');
            let selectedProjectId = projectIdFromURL;

            if (!selectedProjectId) {
                try {
                    selectedProjectId = sessionStorage.getItem('docu_selected_project_id');
                } catch (error) {
                    console.warn('⚠️ Error al leer sessionStorage:', error);
                }
            }

            if (selectedProjectId) {
                setTimeout(() => {
                    const projectItems = projectsList.querySelectorAll('.dsu-project-item');
                    projectItems.forEach(item => {
                        item.classList.remove('dsu-project-item--active', 'active');
                        const itemId = item.getAttribute('data-project-id');
                        if (itemId === selectedProjectId) {
                            item.classList.add('dsu-project-item--active', 'active');
                            console.log('✅ Proyecto marcado como activo en el sidebar:', selectedProjectId);
                        }
                    });
                }, 100);
            }
        }

        // Load Project Data
        function loadProjectData() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            
            if (!projectId) {
                console.warn('⚠️ No hay ID de proyecto en la URL');
                return;
            }

            const project = DocuProjectData.getProjectById(projectId);
            
            if (!project) {
                console.warn('⚠️ Proyecto no encontrado');
                return;
            }

            console.log('✅ Proyecto encontrado:', project);

            // Mostrar nombre del proyecto
            const projectNameDisplay = document.getElementById('projectNameDisplay');
            if (projectNameDisplay && project.name) {
                projectNameDisplay.textContent = project.name;
            }

            // Mostrar budget allocation si existe
            const budgetSection = document.getElementById('budgetSection');
            const budgetDisplay = document.getElementById('budgetDisplay');
            const currencyDisplay = document.getElementById('currencyDisplay');
            
            console.log('🔍 Debug budget/currency:', {
                budgetSection: !!budgetSection,
                budgetDisplay: !!budgetDisplay,
                currencyDisplay: !!currencyDisplay,
                budgetAllocation: project.budgetAllocation,
                currency: project.currency
            });
            
            const hasBudget = project.budgetAllocation && project.budgetAllocation.trim() !== '';
            const hasCurrency = project.currency && project.currency.trim() !== '';
            
            console.log('🔍 hasBudget:', hasBudget, 'hasCurrency:', hasCurrency);
            
            if (hasBudget || hasCurrency) {
                if (budgetDisplay) {
                    if (hasBudget) {
                        budgetDisplay.textContent = project.budgetAllocation;
                        console.log('✅ Budget allocation mostrado:', project.budgetAllocation);
                    } else {
                        budgetDisplay.textContent = '';
                    }
                }
                
                if (currencyDisplay) {
                    if (hasCurrency) {
                        // Agregar un espacio antes del currency para separarlo del budget
                        currencyDisplay.textContent = ' ' + project.currency;
                        console.log('✅ Currency mostrado:', project.currency);
                    } else {
                        currencyDisplay.textContent = '';
                        console.log('⚠️ Currency vacío o no encontrado en project.currency');
                    }
                } else {
                    console.error('❌ currencyDisplay element no encontrado en el DOM');
                }
                
                if (budgetSection) {
                    budgetSection.style.display = 'block';
                    console.log('✅ Budget section mostrada');
                }
            } else {
                console.log('ℹ️ No hay budget ni currency para mostrar');
            }

            // Mostrar project date y status si existen
            const dateStatusSection = document.getElementById('dateStatusSection');
            const projectDateDisplay = document.getElementById('projectDateDisplay');
            const projectStatusDisplay = document.getElementById('projectStatusDisplay');
            
            const hasProjectDate = project.projectDate && project.projectDate.trim() !== '';
            const hasProjectStatus = project.projectStatus && project.projectStatus.trim() !== '';
            
            if (hasProjectDate || hasProjectStatus) {
                if (projectDateDisplay && hasProjectDate) {
                    projectDateDisplay.textContent = project.projectDate;
                    console.log('✅ Project date mostrado:', project.projectDate);
                }
                
                if (projectStatusDisplay && hasProjectStatus) {
                    const statusText = project.projectStatus.split('-').map(word => 
                        word.charAt(0).toUpperCase() + word.slice(1)
                    ).join(' ');
                    projectStatusDisplay.textContent = statusText;
                    
                    // Actualizar la clase del botón según el status (usando las clases del design system)
                    projectStatusDisplay.className = 'dsu-status-button dsu-status-button--' + project.projectStatus;
                    console.log('✅ Project status mostrado:', project.projectStatus);
                }
                
                if (dateStatusSection) {
                    dateStatusSection.style.display = 'flex';
                    console.log('✅ Date/Status section mostrada');
                }
            } else {
                console.log('ℹ️ No hay project date ni status para mostrar');
            }

            // Mostrar Goals y KPIs
            const objectivesSection = document.getElementById('objectivesSection');
            const goalsItemsDisplay = document.getElementById('goalsItemsDisplay');
            const kpisItemsDisplay = document.getElementById('kpisItemsDisplay');
            const goalsTabBtn = document.getElementById('goalsTabBtn');
            const kpisTabBtn = document.getElementById('kpisTabBtn');
            
            if (objectivesSection && (project.goals || project.kpis)) {
                const hasGoals = project.goals && Array.isArray(project.goals) && project.goals.length > 0;
                const hasKpis = project.kpis && Array.isArray(project.kpis) && project.kpis.length > 0;
                
                if (hasGoals || hasKpis) {
                    objectivesSection.style.display = 'block';
                    
                    // Mostrar Goals
                    if (hasGoals && goalsItemsDisplay) {
                        goalsItemsDisplay.innerHTML = '';
                        goalsItemsDisplay.style.display = 'flex';
                        project.goals.forEach(goalText => {
                            if (goalText && goalText.trim()) {
                                const goalItem = document.createElement('div');
                                goalItem.className = 'project-objective-item';
                                goalItem.innerHTML = `
                                    <p class="project-objective-item-text">-${goalText.trim()}</p>
                                `;
                                goalsItemsDisplay.appendChild(goalItem);
                            }
                        });
                        console.log('✅ Goals mostrados:', project.goals.length);
                    } else if (goalsItemsDisplay) {
                        goalsItemsDisplay.style.display = 'none';
                    }
                    
                    // Mostrar KPIs
                    if (hasKpis && kpisItemsDisplay) {
                        kpisItemsDisplay.innerHTML = '';
                        // Inicialmente oculto (se mostrará cuando se haga clic en el tab KPIs)
                        kpisItemsDisplay.style.display = 'none';
                        project.kpis.forEach(kpiText => {
                            if (kpiText && kpiText.trim()) {
                                const kpiItem = document.createElement('div');
                                kpiItem.className = 'project-objective-item';
                                kpiItem.innerHTML = `
                                    <p class="project-objective-item-text">-${kpiText.trim()}</p>
                                `;
                                kpisItemsDisplay.appendChild(kpiItem);
                            }
                        });
                        console.log('✅ KPIs mostrados:', project.kpis.length);
                    } else if (kpisItemsDisplay) {
                        kpisItemsDisplay.style.display = 'none';
                    }
                    
                    // Tabs functionality - Evitar duplicación de listeners
                    if (goalsTabBtn && kpisTabBtn) {
                        // Remover listeners previos si existen (clonar nodos para limpiar)
                        const newGoalsBtn = goalsTabBtn.cloneNode(true);
                        goalsTabBtn.parentNode.replaceChild(newGoalsBtn, goalsTabBtn);
                        const newKpisBtn = kpisTabBtn.cloneNode(true);
                        kpisTabBtn.parentNode.replaceChild(newKpisBtn, kpisTabBtn);
                        
                        // Obtener referencias actualizadas
                        const updatedGoalsBtn = document.getElementById('goalsTabBtn');
                        const updatedKpisBtn = document.getElementById('kpisTabBtn');
                        const updatedGoalsDisplay = document.getElementById('goalsItemsDisplay');
                        const updatedKpisDisplay = document.getElementById('kpisItemsDisplay');
                        
                        // Asegurar estado inicial correcto
                        if (updatedGoalsBtn && updatedKpisBtn) {
                            updatedGoalsBtn.classList.remove('dsu-chip--inactive');
                            updatedGoalsBtn.classList.add('dsu-chip--active');
                            updatedKpisBtn.classList.remove('dsu-chip--active');
                            updatedKpisBtn.classList.add('dsu-chip--inactive');
                        }
                        
                        if (updatedGoalsDisplay && hasGoals) {
                            updatedGoalsDisplay.style.display = 'flex';
                        }
                        if (updatedKpisDisplay && hasKpis) {
                            updatedKpisDisplay.style.display = 'none';
                        }
                        
                        // Event listener para Goals tab
                        updatedGoalsBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            
                            updatedGoalsBtn.classList.remove('dsu-chip--inactive');
                            updatedGoalsBtn.classList.add('dsu-chip--active');
                            updatedKpisBtn.classList.remove('dsu-chip--active');
                            updatedKpisBtn.classList.add('dsu-chip--inactive');
                            
                            if (updatedGoalsDisplay) {
                                updatedGoalsDisplay.style.display = 'flex';
                            }
                            if (updatedKpisDisplay) {
                                updatedKpisDisplay.style.display = 'none';
                            }
                            
                            console.log('📋 Tab Goals seleccionado');
                        });
                        
                        // Event listener para KPIs tab
                        updatedKpisBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            
                            updatedKpisBtn.classList.remove('dsu-chip--inactive');
                            updatedKpisBtn.classList.add('dsu-chip--active');
                            updatedGoalsBtn.classList.remove('dsu-chip--active');
                            updatedGoalsBtn.classList.add('dsu-chip--inactive');
                            
                            if (updatedKpisDisplay) {
                                updatedKpisDisplay.style.display = 'flex';
                            }
                            if (updatedGoalsDisplay) {
                                updatedGoalsDisplay.style.display = 'none';
                            }
                            
                            console.log('📊 Tab KPIs seleccionado');
                        });
                    }
                    
                    console.log('✅ Objectives section mostrada:', {
                        goals: hasGoals ? project.goals.length : 0,
                        kpis: hasKpis ? project.kpis.length : 0
                    });
                }
            }

            // Mostrar stages según Figma
            const stagesSection = document.getElementById('stagesSection');
            const stagesList = document.getElementById('stagesList');
            const overallProgressPercentage = document.getElementById('overallProgressPercentage');
            const overallProgressFill = document.getElementById('overallProgressFill');
            
            if (stagesSection && stagesList && project.stages && project.stages.length > 0) {
                stagesList.innerHTML = '';
                
                let totalProgress = 0;
                let activeStageIndex = -1;
                let stagesWithProgress = 0;
                
                // Determinar cuál es el stage activo (in-progress) y calcular progreso
                project.stages.forEach((stage, index) => {
                    const stageName = (stage.name || '').toLowerCase();
                    if (stageName.includes('progress') || stageName === 'in progress') {
                        activeStageIndex = index;
                    }
                    
                    // Sumar progreso de todos los stages (si tienen progreso guardado)
                    if (stage.progress !== undefined && stage.progress !== null) {
                        totalProgress += stage.progress;
                        stagesWithProgress++;
                    }
                });
                
                // Si no hay stage activo, usar el primero
                if (activeStageIndex === -1 && project.stages.length > 0) {
                    activeStageIndex = 0;
                }
                
                // Si el stage activo no tiene progreso, asignarle 10% por defecto
                if (activeStageIndex >= 0 && (!project.stages[activeStageIndex].progress || project.stages[activeStageIndex].progress === 0)) {
                    if (stagesWithProgress === 0) {
                        totalProgress = 10; // Si ningún stage tiene progreso, usar 10% para el activo
                        stagesWithProgress = 1;
                    }
                }
                
                // Calcular overall progress (promedio de stages con progreso, o 10% si solo hay uno activo)
                let overallProgress = 0;
                if (stagesWithProgress > 0) {
                    overallProgress = Math.round(totalProgress / stagesWithProgress);
                } else if (activeStageIndex >= 0) {
                    overallProgress = 10; // Default para stage activo sin progreso guardado
                }
                
                // Actualizar overall progress
                if (overallProgressPercentage) {
                    overallProgressPercentage.textContent = overallProgress + '%';
                }
                if (overallProgressFill) {
                    overallProgressFill.style.width = overallProgress + '%';
                }
                
                // Crear cards para cada stage
                project.stages.forEach((stage, index) => {
                    const stageItem = document.createElement('div');
                    stageItem.className = 'stage-item';
                    
                    const isActive = index === activeStageIndex;
                    const stageProgress = isActive ? (stage.progress || 10) : 0;
                    
                    // Determinar el estado del stage
                    let stageStatusClass = 'dsu-stage-status--to-start';
                    const stageNameLower = (stage.name || '').toLowerCase();
                    if (stageNameLower.includes('progress') || stageNameLower === 'in progress') {
                        stageStatusClass = 'dsu-stage-status--in-progress';
                    } else if (stageNameLower.includes('done') || stageNameLower.includes('completed')) {
                        stageStatusClass = 'dsu-stage-status--completed';
                    }
                    
                    // Agregar clase inactive si no es el activo
                    if (!isActive) {
                        stageItem.classList.add('stage-item--inactive');
                    }
                    
                    // Crear estructura del stage card según Figma
                    const stageCard = document.createElement('div');
                    stageCard.className = `dsu-stage-status ${stageStatusClass}`;
                    
                    // Badge con nombre del stage
                    const badge = document.createElement('div');
                    badge.className = 'dsu-stage-status__badge';
                    const badgeText = document.createElement('span');
                    badgeText.className = 'dsu-stage-status__badge-text';
                    badgeText.textContent = stage.name || 'Sin nombre';
                    badge.appendChild(badgeText);
                    
                    // Agregar icono solo si es in-progress
                    if (isActive && stageStatusClass === 'dsu-stage-status--in-progress') {
                        const badgeIcon = document.createElement('span');
                        badgeIcon.className = 'dsu-stage-status__badge-icon';
                        const iconImg = document.createElement('img');
                        iconImg.src = 'images/Progress.svg';
                        iconImg.alt = 'Progress';
                        badgeIcon.appendChild(iconImg);
                        badge.appendChild(badgeIcon);
                    }
                    
                    // Fecha
                    const date = document.createElement('p');
                    date.className = 'dsu-stage-status__date';
                    date.textContent = stage.dateRange || '';
                    
                    // Barra de progreso (solo para el stage activo)
                    let progressBar = null;
                    if (isActive) {
                        progressBar = document.createElement('div');
                        progressBar.className = 'dsu-progress dsu-progress--default dsu-progress--full-width';
                        
                        const progressPercentage = document.createElement('span');
                        progressPercentage.className = 'dsu-progress__percentage';
                        progressPercentage.textContent = stageProgress + '%';
                        
                        const progressBarContainer = document.createElement('div');
                        progressBarContainer.className = 'dsu-progress__bar';
                        
                        const progressFill = document.createElement('div');
                        progressFill.className = 'dsu-progress__fill';
                        progressFill.style.width = stageProgress + '%';
                        
                        progressBarContainer.appendChild(progressFill);
                        progressBar.appendChild(progressPercentage);
                        progressBar.appendChild(progressBarContainer);
                    }
                    
                    // Ensamblar card
                    stageCard.appendChild(badge);
                    stageCard.appendChild(date);
                    if (progressBar) {
                        stageCard.appendChild(progressBar);
                    }
                    
                    stageItem.appendChild(stageCard);
                    stagesList.appendChild(stageItem);
                });
                
                stagesSection.style.display = 'block';
                console.log('✅ Stages mostrados:', project.stages.length, 'Overall progress:', overallProgress + '%');
            }

            // Mostrar teams (usando el mismo componente que project_empty.html)
            const teamsSection = document.getElementById('teamsSection');
            const teamsListDisplay = document.getElementById('teamsListDisplay');
            if (teamsSection && teamsListDisplay && project.teams && project.teams.length > 0) {
                teamsListDisplay.innerHTML = '';
                
                // Cargar datos completos de los teams desde DocuProjectData
                const projectData = DocuProjectData.getProjectData();
                
                project.teams.forEach(async (projectTeam) => {
                    // Buscar el team completo en projectData
                    const fullTeam = projectData.teams?.find(t => t.id === projectTeam.id);
                    
                    if (!fullTeam) {
                        console.warn('⚠️ Team no encontrado:', projectTeam.id);
                        return;
                    }
                    
                    const teamName = fullTeam.name || projectTeam.name || 'Sin nombre';
                    const members = fullTeam.members || [];
                    
                    // Crear estructura del team-item (igual que en project_empty.html)
                    const teamItem = document.createElement('div');
                    teamItem.className = 'team-item';
                    teamItem.setAttribute('data-team-id', projectTeam.id);
                    
                    // Crear título del team
                    const teamTitle = document.createElement('div');
                    teamTitle.className = 'team-name-title';
                    
                    const teamTitleText = document.createElement('span');
                    teamTitleText.className = 'team-name-title__text';
                    teamTitleText.textContent = teamName;
                    
                    teamTitle.appendChild(teamTitleText);
                    
                    // Crear with-members-row
                    const withMembersRow = document.createElement('div');
                    withMembersRow.className = 'with-members-row';
                    
                    const withMembersRowLeft = document.createElement('div');
                    withMembersRowLeft.className = 'with-members-row__left';
                    
                    const avatarsRow = document.createElement('div');
                    avatarsRow.className = 'avatars-row';
                    
                    // Mostrar máximo 5 avatares
                    const maxVisible = 5;
                    const visibleMembers = members.slice(0, maxVisible);
                    const remainingCount = members.length - maxVisible;
                    
                    // Cargar imágenes de los miembros de forma asíncrona
                    const avatarPromises = visibleMembers.map(async (member) => {
                        const avatarElement = document.createElement('span');
                        avatarElement.className = 'avatar';
                        avatarElement.setAttribute('role', 'button');
                        avatarElement.setAttribute('tabindex', '0');
                        avatarElement.setAttribute('aria-label', `${member.name || ''} ${member.lastName || ''}`.trim() || 'member');
                        
                        const avatarImg = document.createElement('img');
                        avatarImg.className = 'avatar__img';
                        avatarImg.alt = `${member.name || ''} ${member.lastName || ''}`.trim() || 'member';
                        
                        // Usar getMemberImage para cargar correctamente desde IndexedDB o base64
                        if (typeof getMemberImage === 'function') {
                            try {
                                const imageSrc = await getMemberImage(member.image);
                                avatarImg.src = imageSrc;
                            } catch (error) {
                                console.error('❌ Error al cargar imagen del miembro:', error);
                                avatarImg.src = 'images/avatar_icon.svg';
                            }
                        } else {
                            // Fallback si getMemberImage no está disponible
                            avatarImg.src = member.image || 'images/avatar_icon.svg';
                        }
                        
                        avatarElement.appendChild(avatarImg);
                        return avatarElement;
                    });
                    
                    // Esperar a que todas las imágenes se carguen y agregar al DOM
                    Promise.all(avatarPromises).then(avatarElements => {
                        avatarElements.forEach(avatarElement => {
                            avatarsRow.appendChild(avatarElement);
                        });
                        
                        // Agregar overflow badge si hay más miembros
                        if (remainingCount > 0) {
                            const overflowAvatar = document.createElement('span');
                            overflowAvatar.className = 'avatar avatar--overflow';
                            overflowAvatar.textContent = `+${remainingCount}`;
                            avatarsRow.appendChild(overflowAvatar);
                        }
                        
                        withMembersRowLeft.appendChild(avatarsRow);
                        withMembersRow.appendChild(withMembersRowLeft);
                        
                        teamItem.appendChild(teamTitle);
                        teamItem.appendChild(withMembersRow);
                        teamsListDisplay.appendChild(teamItem);
                    }).catch(error => {
                        console.error('❌ Error al cargar avatares:', error);
                    });
                });
                
                teamsSection.style.display = 'block';
            }

            // Mostrar assets
            const assetsSection = document.getElementById('assetsSection');
            const assetsListDisplay = document.getElementById('assetsListDisplay');
            if (assetsSection && assetsListDisplay && project.assets && project.assets.length > 0) {
                assetsListDisplay.innerHTML = '';
                project.assets.forEach(asset => {
                    const assetItem = document.createElement('div');
                    assetItem.className = 'asset-item';
                    let content = '';
                    if (asset.text) {
                        content += `<div class="asset-text">${asset.text}</div>`;
                    }
                    if (asset.link) {
                        content += `<a href="${asset.link}" target="_blank" class="asset-link">${asset.link}</a>`;
                    }
                    assetItem.innerHTML = content;
                    assetsListDisplay.appendChild(assetItem);
                });
                assetsSection.style.display = 'block';
            }
            
            // Mostrar Agreements
            const agreementsSection = document.getElementById('agreementsSection');
            const agreementsListDisplay = document.getElementById('agreementsListDisplay');
            if (agreementsSection && agreementsListDisplay && project.agreements && project.agreements.length > 0) {
                agreementsListDisplay.innerHTML = '';
                
                project.agreements.forEach((agreement, index) => {
                    const agreementItem = document.createElement('div');
                    agreementItem.className = 'agreement-item';
                    
                    let agreementHTML = '';
                    
                    // Título del agreement
                    if (agreement.name) {
                        agreementHTML += `<div class="agreement-item-title">${escapeHtml(agreement.name)}</div>`;
                    }
                    
                    // Meta información (fecha y status)
                    let metaHTML = '<div class="agreement-item-meta">';
                    if (agreement.date) {
                        metaHTML += `<span class="agreement-item-date">${escapeHtml(agreement.date)}</span>`;
                    }
                    if (agreement.status) {
                        const statusText = agreement.status.split('-').map(word => 
                            word.charAt(0).toUpperCase() + word.slice(1)
                        ).join(' ');
                        metaHTML += `<span class="agreement-item-status agreement-item-status--${agreement.status}">${escapeHtml(statusText)}</span>`;
                    }
                    metaHTML += '</div>';
                    agreementHTML += metaHTML;
                    
                    // Items del agreement
                    if (agreement.items && Array.isArray(agreement.items) && agreement.items.length > 0) {
                        agreementHTML += '<div class="agreement-item-items">';
                        agreement.items.forEach(itemText => {
                            if (itemText && itemText.trim()) {
                                agreementHTML += `<div class="agreement-item-item">-${escapeHtml(itemText.trim())}</div>`;
                            }
                        });
                        agreementHTML += '</div>';
                    }
                    
                    agreementItem.innerHTML = agreementHTML;
                    agreementsListDisplay.appendChild(agreementItem);
                });
                
                agreementsSection.style.display = 'block';
                console.log('✅ Agreements mostrados:', project.agreements.length);
            } else {
                console.log('ℹ️ No hay Agreements para mostrar');
            }
            
            // Mostrar Project context
            const projectContextSection = document.getElementById('projectContextSection');
            const projectContextDisplay = document.getElementById('projectContextDisplay');
            if (projectContextDisplay && project.projectContext && project.projectContext.trim()) {
                projectContextDisplay.innerHTML = project.projectContext;
                if (projectContextSection) {
                    projectContextSection.style.display = 'block';
                }
                console.log('✅ Project context mostrado');
            } else {
                console.log('ℹ️ No hay Project context para mostrar');
            }
            
            // Mostrar What do you want to solve?
            const solveSection = document.getElementById('solveSection');
            const solveDisplay = document.getElementById('solveDisplay');
            if (solveDisplay && project.solveDescription && project.solveDescription.trim()) {
                solveDisplay.innerHTML = project.solveDescription;
                if (solveSection) {
                    solveSection.style.display = 'block';
                }
                console.log('✅ What do you want to solve mostrado');
            } else {
                console.log('ℹ️ No hay What do you want to solve para mostrar');
            }
            
            // Mostrar Solution approach
            const solutionApproachSection = document.getElementById('solutionApproachSection');
            const solutionApproachDisplay = document.getElementById('solutionApproachDisplay');
            if (solutionApproachDisplay && project.solutionApproach && project.solutionApproach.trim()) {
                solutionApproachDisplay.innerHTML = project.solutionApproach;
                if (solutionApproachSection) {
                    solutionApproachSection.style.display = 'block';
                }
                console.log('✅ Solution approach mostrado');
            } else {
                console.log('ℹ️ No hay Solution approach para mostrar');
            }
            
            // Mostrar Deliverables
            const deliverablesSection = document.getElementById('deliverablesSection');
            const deliverablesListDisplay = document.getElementById('deliverablesListDisplay');
            if (deliverablesListDisplay && project.deliverables && Array.isArray(project.deliverables) && project.deliverables.length > 0) {
                deliverablesListDisplay.innerHTML = '';
                
                project.deliverables.forEach((deliverable) => {
                    const deliverableItem = document.createElement('div');
                    deliverableItem.className = 'deliverable-item';
                    
                    let previewHtml = '';
                    let contentHtml = '';
                    
                    if (deliverable.type === 'image' && deliverable.preview) {
                        previewHtml = `<img src="${deliverable.preview}" alt="${escapeHtml(deliverable.name || '')}" class="deliverable-item-preview">`;
                        contentHtml = `
                            <div class="deliverable-item-content">
                                <p class="deliverable-item-text">${escapeHtml(deliverable.name || '')}</p>
                                ${deliverable.size ? `<p class="deliverable-item-link">${escapeHtml(deliverable.size)}</p>` : ''}
                            </div>
                        `;
                    } else if (deliverable.type === 'file') {
                        previewHtml = `
                            <div class="deliverable-item-icon">
                                <img src="images/attachment.svg" alt="File">
                            </div>
                        `;
                        contentHtml = `
                            <div class="deliverable-item-content">
                                <p class="deliverable-item-text">${escapeHtml(deliverable.name || '')}</p>
                                ${deliverable.size ? `<p class="deliverable-item-link">${escapeHtml(deliverable.size)}</p>` : ''}
                            </div>
                        `;
                    } else if (deliverable.type === 'link' && deliverable.url) {
                        previewHtml = `
                            <div class="deliverable-item-icon">
                                <img src="images/link.svg" alt="Link">
                            </div>
                        `;
                        contentHtml = `
                            <div class="deliverable-item-content">
                                <p class="deliverable-item-text">${escapeHtml(deliverable.name || deliverable.url)}</p>
                                <div class="deliverable-item-link">
                                    <a href="${escapeHtml(deliverable.url)}" target="_blank">${escapeHtml(deliverable.url)}</a>
                                </div>
                            </div>
                        `;
                    } else if (deliverable.type === 'text' && deliverable.text) {
                        contentHtml = `
                            <div class="deliverable-item-content">
                                <p class="deliverable-item-text">-${escapeHtml(deliverable.text)}</p>
                            </div>
                        `;
                    }
                    
                    deliverableItem.innerHTML = previewHtml + contentHtml;
                    deliverablesListDisplay.appendChild(deliverableItem);
                });
                
                if (deliverablesSection) {
                    deliverablesSection.style.display = 'block';
                }
                console.log('✅ Deliverables mostrados:', project.deliverables.length);
            } else {
                console.log('ℹ️ No hay Deliverables para mostrar');
            }
        }
        
        // Helper function para escapar HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
