<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Team - Docu</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="design-system/tokens/index.css">
    <link rel="stylesheet" href="design-system/components/navigation.css">
    <link rel="stylesheet" href="design-system/components/input.css">
    <link rel="stylesheet" href="design-system/components/button.css">
    <link rel="stylesheet" href="design-system/components/chip.css">
    <link rel="stylesheet" href="design-system/components/card.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-secondary, 'Lato', sans-serif);
            background-color: var(--color-surface-regular, #ffffff);
            color: var(--color-text-primary, #0a243f);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Layout Principal */
        .create-team-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenido Principal */
        .team-content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        .team-content {
            flex: 1;
            padding: 64px 173px 0 135px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 80%;
            margin: 0 auto;
        }

        /* Data Level - Formulario principal */
        .data-level {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Name Level */
        .name-level {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }

        .project-name-group {
            flex: 1;
        }

        .team-cost-group {
            flex: 1;
            max-width: 839px;
        }

        .search-input-group {
            flex: 1;
        }

        .associated-projects-group {
            /* flex: 1; */
        }

        /* Input width override para create_team */
        .dsu-input {
            width: 840px;
        }
        
        /* Asegurar que el icono del buscador esté dentro del input */
        .dsu-input-buscador {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .dsu-input-buscador .dsu-input {
            padding-right: calc(var(--spacing-16) + 20px + var(--spacing-08));
            box-sizing: border-box;
        }
        
        .dsu-input-buscador__send-icon {
            position: absolute;
            right: var(--spacing-16);
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            /* Asegurar que el icono esté dentro del área del input */
            margin: 0;
            padding: 0;
        }
        
        .dsu-input-buscador__send-icon--active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Primary Actions Level */
        .primary-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn-share-team {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid var(--color-text-primary, #0a243f);
            border-radius: 40px;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-family-secondary, 'Lato');
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text-primary, #0a243f);
        }

        .btn-share-team:hover:not(:disabled) {
            opacity: 0.8;
        }

        .btn-share-team:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: var(--color-status-disabled, #efefef);
            color: var(--color-text-secondary, #6b7b8a);
            border-color: var(--color-status-disabled, #efefef);
        }

        .btn-add-member {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-buttons-primary-bg-default, #9dff00);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-family-secondary, 'Lato');
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-primary, #0a243f);
        }

        .btn-add-member:hover {
            background-color: #98f501;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px);
            visibility: hidden;
        }

        .modal-overlay.active {
            display: flex !important;
            opacity: 1 !important;
            visibility: visible !important;
        }

        .modal-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 24px;
            animation: modalContainerFadeIn 0.3s ease;
        }

        @keyframes modalContainerFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .add-member-modal {
            background: var(--color-basics-white);
            border: 1px solid var(--color-basics-mid-blue);
            border-radius: 10px;
            padding: 32px;
            max-width: 856px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 32px rgba(10, 36, 63, 0.15);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-wrapper {
            display: flex;
            flex-direction: column;
            gap: 48px;
            margin: 0;
            padding: 0;
        }

        /* Modal Header */
        .modal-header-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .modal-headline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .modal-title {
            font-family: 'Lato', sans-serif;
            font-size: 24px;
            font-weight: var(--font-weight-black);
            color: var(--color-basics-dark-blue);
            margin: 0;
            padding: 0;
            flex: 1;
            line-height: normal;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            transition: opacity 0.2s ease;
            margin: 0;
            margin-left: auto;
        }

        .modal-close-btn:hover {
            opacity: 0.7;
        }

        .modal-description {
            font-family: var(--font-family-secondary);
            font-size: 16px;
            font-weight: var(--font-weight-regular);
            line-height: 1.5;
            color: var(--color-basics-dark-blue);
            margin: 0;
            padding: 0;
        }

        /* Modal Content */
        .modal-content-wrapper {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .modal-profile-avatar {
            width: 200px;
            height: 200px;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
        }

        .modal-inputs-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            min-width: 0;
            width: 424px;
            margin: 0;
            padding: 0;
        }

        .modal-input-row {
            display: flex;
            gap: 16px;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .modal-input-row .modal-input-group {
            flex: 1;
            min-width: 0;
            margin: 0;
            padding: 0;
        }

        .modal-input-group {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-04);
            width: 100%;
        }

        .modal-input-group .dsu-input-label {
            font-weight: var(--font-weight-black);
            font-size: 14px;
            margin: 0;
            padding: 0;
            margin-bottom: 4px;
        }

        .modal-input-group .dsu-input-label span::after {
            content: none;
        }

        .modal-input-group .dsu-input {
            margin: 0;
            padding: var(--spacing-12) var(--spacing-16);
            width: 100%;
            min-height: 48px;
        }

        /* Modal Buttons */
        .modal-buttons-level {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin: 0;
            padding: 0;
            gap: 0;
        }

        .modal-cancel-btn,
        .modal-add-btn {
            width: 152px;
            padding: 12px 24px;
            height: auto;
            min-height: 48px;
            margin: 0;
        }

        .modal-cancel-btn .dsu-button__icon,
        .modal-add-btn .dsu-button__icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .modal-cancel-btn .dsu-button__icon img,
        .modal-add-btn .dsu-button__icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Avatar Preview in Modal */
        .modal-avatar-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-lg);
            z-index: 0;
        }

        .modal-profile-avatar .dsu-profile-avatar {
            width: 200px;
            height: 200px;
            position: relative;
        }

        /* Ensure avatar icon and preview are positioned correctly */
        .modal-profile-avatar .dsu-profile-avatar__icon {
            position: absolute;
            top: var(--spacing-08);
            left: var(--spacing-08);
            z-index: 0;
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        /* Cost Edit Level */
        .cost-edit-level {
            display: flex;
            align-items: flex-end;
            /* justify-content: space-between; */
            gap: 16px;
        }

        .team-cost-group {
            flex: 1;
            max-width: 839px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }


        /* Secondary Action Levels */
        .secondary-actions {
            display: flex;
            align-items: center;
            gap: 32px;
        }
        
        /* Estado deshabilitado de secondary-actions */
        .secondary-actions.disabled {
            opacity: 0.5;
            pointer-events: none;
            user-select: none;
        }
        
        .secondary-actions.disabled * {
            cursor: not-allowed !important;
        }
        
        .secondary-actions.disabled input,
        .secondary-actions.disabled button {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-input-group {
            flex: 1;
        }
        
        /* Input Buscador - Override width para create_team */
        .search-input-group.dsu-input-buscador {
            width: 100%;
            max-width: 840px;
        }
        
        .search-input-group.dsu-input-buscador .dsu-input {
            width: 100%;
        }

        .view-controls {
            display: flex;
            gap: 0;
            align-items: center;
        }

        .view-control-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-surface-regular, #ffffff);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-family-secondary, 'Lato');
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text-primary, #0a243f);
        }

        .view-control-btn:hover {
            opacity: 0.8;
        }

        .view-control-btn.active {
            background-color: var(--color-surface-especial, #f4f7fb);
        }

        /* Associated Projects */
        .associated-projects-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 839px;
        }
        
        /* Chips Container */
        .projects-chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-08);
            margin-top: var(--spacing-12);
            min-height: 24px;
        }

        /* Team Members Section */
        .team-members-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .team-members-title {
            font-family: var(--font-family-secondary, 'Lato');
            font-size: 24px;
            font-weight: var(--font-weight-black, 800);
            color: var(--color-text-primary, #0a243f);
            line-height: normal;
        }

        .team-members-grid {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: flex-start;
        }


        /* Sticky Buttons - Usando design system, ajuste de centrado */
        .dsu-sticky-buttons {
            justify-content: center;
            /* width: 80%; */
            margin: 0 auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .team-content-wrapper {
                margin-left: 0;
            }

            .team-content {
                padding: 24px 16px;
            }

            .dsu-sticky-buttons {
                padding: var(--spacing-16);
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="create-team-container">
        <!-- Sidebar Navigation -->
        <nav class="dsu-sidebar">
            <div class="dsu-sidebar__main">
                <!-- Logo Container -->
                <div class="dsu-sidebar__logo-container">
                    <a href="#" class="dsu-sidebar__logo">
                        <img src="images/logo.svg" alt="Docu Logo">
                    </a>
                </div>
                
                <!-- Navigation Wrapper -->
                <div class="dsu-sidebar__navigation-wrapper">
                    <!-- Navigation Main -->
                    <div class="dsu-sidebar__navigation">
                        <!-- Teams Level -->
                        <div class="dsu-teams-level">
                            <button class="dsu-teams-button dsu-teams-button--active">
                                <span class="dsu-teams-button__icon">
                                    <img src="images/team.svg" alt="Teams">
                                </span>
                                <span class="dsu-nav-button__text">Teams</span>
                            </button>
                            <div class="dsu-teams-chevron">
                                <img src="images/down-chevron.svg" alt="Chevron">
                            </div>
                        </div>
                        
                        <!-- Teams Dropdown -->
                        <div class="dsu-teams-dropdown dsu-teams-dropdown--expanded">
                            <button class="dsu-teams-create" id="createTeamBtn">
                                <span>Create new team</span>
                                <span class="dsu-teams-create__icon">
                                    <img src="images/plus.svg" alt="Plus">
                                </span>
                            </button>
                            <div class="dsu-teams-list" id="teamsList">
                                <!-- Teams list se poblará dinámicamente -->
                            </div>
                        </div>
                        
                        <!-- Projects Level -->
                        <div class="dsu-projects-button">
                            <div class="dsu-projects-level">
                                <button class="dsu-projects-button__trigger">
                                    <span class="dsu-projects-button__icon">
                                        <img src="images/project.svg" alt="Projects">
                                    </span>
                                    <span class="dsu-projects-button__text">Projects</span>
                                </button>
                                <div class="dsu-projects-chevron">
                                    <img src="images/down-chevron.svg" alt="Chevron">
                                </div>
                            </div>
                            
                            <!-- Projects Dropdown -->
                            <div class="dsu-projects-dropdown">
                                <!-- Projects list -->
                            </div>
                        </div>
                        
                        <!-- Profile Button -->
                        <button class="dsu-nav-button">
                            <span class="dsu-nav-button__icon">
                                <img src="images/avatar.svg" alt="Profile">
                            </span>
                            <span class="dsu-nav-button__text">Profile</span>
                        </button>
                        
                        <!-- Feedback Button -->
                        <button class="dsu-nav-button">
                            <span class="dsu-nav-button__icon">
                                <img src="images/chat.svg" alt="Feedback">
                            </span>
                            <span class="dsu-nav-button__text">Give us feedback</span>
                        </button>
                    </div>
                    
                    <!-- Sidebar Footer -->
                    <div class="dsu-sidebar__footer">
                        <button class="dsu-nav-button" id="darkModeBtn">
                            <span class="dsu-nav-button__icon">
                                <img src="images/moon.svg" alt="Dark Mode">
                            </span>
                            <span class="dsu-nav-button__text">Dark mode</span>
                        </button>
                        <button class="dsu-nav-button" id="logoutBtn">
                            <span class="dsu-nav-button__icon">
                                <img src="images/exit.svg" alt="Logout">
                            </span>
                            <span class="dsu-nav-button__text">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="team-content-wrapper">
            <div class="team-content">
                <!-- Data Level -->
                <div class="data-level">
                    <!-- Name Level -->
                    <div class="name-level">
                        <div class="dsu-input-group project-name-group">
                            <div class="dsu-input-label">
                                <div class="dsu-input-label__text">
                                    <span>Project name:</span>
                                </div>
                            </div>
                            <input 
                                type="text" 
                                id="projectName" 
                                class="dsu-input" 
                                placeholder="Team name"
                                autocomplete="off"
                            >
                        </div>
                        <div class="primary-actions">
                            <button class="btn-share-team" id="shareTeamBtn" disabled>
                                <span>Share team</span>
                                <img src="images/share.svg" alt="Share" class="btn-icon">
                            </button>
                            <button class="btn-add-member" id="addMemberBtn">
                                <span>Add new member</span>
                                <img src="images/plus.svg" alt="Plus" class="btn-icon">
                            </button>
                        </div>
                    </div>

                    <!-- Cost Edit Level -->
                    <div class="cost-edit-level">
                        <div class="dsu-input-group team-cost-group">
                            <div class="dsu-input-label">
                                <div class="dsu-input-label__text">
                                    <span>Team cost:</span>
                                </div>
                            </div>
                            <input 
                                type="text" 
                                id="teamCost" 
                                class="dsu-input" 
                                placeholder="Automatically calculated from teammates income in USD"
                                readonly
                            >
                        </div>
                    </div>
                </div>

                <!-- Secondary Action Levels -->
                <div class="secondary-actions disabled">
                    <div class="dsu-input-buscador search-input-group">
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="dsu-input dsu-input--only" 
                            placeholder="Missing someone? find it here."
                        >
                        <span class="dsu-input-buscador__send-icon" id="searchSendIcon">
                            <img src="images/send.svg" alt="Send">
                        </span>
                    </div>
                    <div class="view-controls">
                        <button class="view-control-btn active" id="gridViewBtn" title="Grid view">
                            <img src="images/grid.svg" alt="Grid" class="btn-icon">
                        </button>
                        <button class="view-control-btn" id="listViewBtn" title="List view">
                            <img src="images/list.svg" alt="List" class="btn-icon">
                        </button>
                        <button class="view-control-btn" id="filtersBtn">
                            <span>Filters</span>
                            <img src="images/filter.svg" alt="Filter" class="btn-icon">
                        </button>
                    </div>
                </div>

                <!-- Associated Projects -->
                <div class="dsu-input-group associated-projects-group">
                    <div class="dsu-input-label">
                        <div class="dsu-input-label__text">
                            <span>Associated projects:</span>
                        </div>
                    </div>
                    <input 
                        type="text" 
                        id="associatedProjects" 
                        class="dsu-input" 
                        placeholder="Type project name and press Enter"
                    >
                    <div class="projects-chips-container" id="projectsChipsContainer">
                        <!-- Chips will be dynamically added here -->
                    </div>
                </div>

                <!-- Team Members Section -->
                <div class="team-members-section">
                    <h2 class="team-members-title">Team members</h2>
                    <div class="team-members-grid" id="teamMembersGrid">
                        <!-- Placeholder Profile Card -->
                        <div class="dsu-profile-card-placeholder" id="addMemberCard">
                            <div class="dsu-profile-card-placeholder__image">
                                <div class="dsu-profile-card-placeholder__edit-icon">
                                    <img src="images/plus.svg" alt="Add member">
                                </div>
                            </div>
                            <div class="dsu-profile-card-placeholder__content">
                                <div class="dsu-profile-card-placeholder__name-job">
                                    <div class="dsu-profile-card-placeholder__name">Name</div>
                                    <div class="dsu-profile-card-placeholder__job">Job position</div>
                                </div>
                                <div class="dsu-profile-card-placeholder__contact">
                                    <div class="dsu-profile-card-placeholder__contact-item">
                                        <img src="images/mail.svg" alt="Email" class="dsu-profile-card-placeholder__contact-icon">
                                        <span class="dsu-profile-card-placeholder__contact-text">email</span>
                                    </div>
                                    <div class="dsu-profile-card-placeholder__contact-item">
                                        <img src="images/whatsapp.svg" alt="Contact" class="dsu-profile-card-placeholder__contact-icon">
                                        <span class="dsu-profile-card-placeholder__contact-text">Contact</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sticky Buttons -->
            <div class="dsu-sticky-buttons">
                <button class="dsu-button dsu-button--secondary dsu-button--medium dsu-sticky-buttons__button" id="saveDraftBtn">Save draft</button>
                <button class="dsu-button dsu-button--primary dsu-button--medium dsu-sticky-buttons__button" id="publishBtn" disabled>Publish</button>
            </div>
        </div>
    </div>

    <!-- Add Member Modal -->
    <div class="modal-overlay" id="addMemberModalOverlay">
        <div class="modal-container">
            <div class="add-member-modal">
                <div class="modal-wrapper">
                    <!-- Modal Header -->
                    <div class="modal-header-section">
                        <div class="modal-headline">
                            <h2 class="modal-title">Add a new member</h2>
                            <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close modal">
                                <img src="images/close.svg" alt="Close" width="20" height="20">
                            </button>
                        </div>
                        <p class="modal-description">-Implement personalized recommendation algorithms to enhance user engagement.</p>
                    </div>

                    <!-- Modal Content -->
                    <div class="modal-content-wrapper">
                        <!-- Profile Avatar -->
                        <div class="modal-profile-avatar">
                            <div class="dsu-profile-avatar">
                                <img src="images/avatar_icon.svg" alt="Avatar" class="dsu-profile-avatar__icon" id="modalAvatarIcon">

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/project-data.js"></script>
    <script>
        // ============================================
        // Verificación de Sesión
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si hay sesión activa
            if (typeof window.DocuAuth === 'undefined' || !DocuAuth.isAuthenticated()) {
                // Redirigir al login si no hay sesión
                window.location.href = 'index.html';
                return;
            }

            // Inicializar la página
            initCreateTeamPage();
        });

        // ============================================
        // Inicialización
        // ============================================
        function initCreateTeamPage() {
            // Esperar a que los scripts se carguen
            if (typeof window.DocuAuth === 'undefined' || typeof window.DocuProjectData === 'undefined') {
                setTimeout(initCreateTeamPage, 100);
                return;
            }

            console.log('Inicializando create_team.html');

            // Inicializar navegación del sidebar
            initSidebarNavigation();

            // Inicializar funcionalidad del formulario
            initFormFunctionality();

            // Inicializar Input Buscador
            initInputBuscador();

            // Inicializar funcionalidad del modal PRIMERO
            initModalFunctionality();

            // Inicializar gestión de miembros
            initMembersManagement();

            // Inicializar funcionalidad de chips para Associated Projects
            initAssociatedProjectsChips();

            // Deshabilitar secondary-actions inicialmente
            disableSecondaryActions();

            // Cargar equipos en el sidebar
            loadTeamsInSidebar();

            // Cargar datos del proyecto actual si existe
            loadCurrentProjectData();
        }

        // ============================================
        // Sidebar Navigation
        // ============================================
        function initSidebarNavigation() {
            // Teams Dropdown
            const teamsButtons = document.querySelectorAll('.dsu-teams-button');
            teamsButtons.forEach((button) => {
                const teamsLevel = button.closest('.dsu-teams-level');
                if (!teamsLevel) return;
                
                const chevron = teamsLevel.querySelector('.dsu-teams-chevron img');
                const dropdown = teamsLevel.parentElement.querySelector('.dsu-teams-dropdown');
                
                if (!dropdown) return;
                
                button.addEventListener('click', function() {
                    const isExpanded = dropdown.classList.contains('dsu-teams-dropdown--expanded');
                    
                    if (isExpanded) {
                        dropdown.classList.remove('dsu-teams-dropdown--expanded');
                        button.classList.remove('dsu-teams-button--active');
                        if (chevron) chevron.src = 'images/down-chevron.svg';
                    } else {
                        dropdown.classList.add('dsu-teams-dropdown--expanded');
                        button.classList.add('dsu-teams-button--active');
                        if (chevron) chevron.src = 'images/up-chevron.svg';
                    }
                });

                if (chevron && chevron.closest('.dsu-teams-chevron')) {
                    chevron.closest('.dsu-teams-chevron').addEventListener('click', function() {
                        button.click();
                    });
                }
            });

            // Projects Dropdown
            const projectsTriggers = document.querySelectorAll('.dsu-projects-button__trigger');
            projectsTriggers.forEach((trigger) => {
                const projectsLevel = trigger.closest('.dsu-projects-level');
                if (!projectsLevel) return;
                
                const chevron = projectsLevel.querySelector('.dsu-projects-chevron img');
                const projectsButton = trigger.closest('.dsu-projects-button');
                const dropdown = projectsButton.querySelector('.dsu-projects-dropdown');
                
                if (!dropdown) return;
                
                trigger.addEventListener('click', function() {
                    const isExpanded = dropdown.classList.contains('dsu-projects-dropdown--expanded');
                    
                    if (isExpanded) {
                        dropdown.classList.remove('dsu-projects-dropdown--expanded');
                        trigger.classList.remove('dsu-projects-button__trigger--active');
                        if (chevron) chevron.src = 'images/down-chevron.svg';
                    } else {
                        dropdown.classList.add('dsu-projects-dropdown--expanded');
                        trigger.classList.add('dsu-projects-button__trigger--active');
                        if (chevron) chevron.src = 'images/up-chevron.svg';
                    }
                });

                if (chevron && chevron.closest('.dsu-projects-chevron')) {
                    chevron.closest('.dsu-projects-chevron').addEventListener('click', function() {
                        trigger.click();
                    });
                }
            });

            // Logout
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                        DocuAuth.logout();
                        window.location.href = 'index.html';
                    }
                });
            }
        }

        // ============================================
        // Form Functionality
        // ============================================
        let currentProjectId = null;
        let currentProjectData = null;

        function initFormFunctionality() {
            const projectNameInput = document.getElementById('projectName');
            const publishBtn = document.getElementById('publishBtn');
            const saveDraftBtn = document.getElementById('saveDraftBtn');

            // Validación: Habilitar/deshabilitar botón Publish
            // El botón Share team permanece siempre deshabilitado en esta pantalla
            projectNameInput.addEventListener('input', function() {
                const hasProjectName = projectNameInput.value.trim().length > 0;
                publishBtn.disabled = !hasProjectName;
            });

            // Save Draft
            saveDraftBtn.addEventListener('click', function() {
                saveDraft();
            });

            // Publish
            publishBtn.addEventListener('click', function() {
                publishProject();
            });
        }

        function saveDraft() {
            const projectData = getFormData();
            projectData.status = 'draft';
            
            if (!currentProjectId) {
                currentProjectId = Date.now().toString();
            }

            saveProjectToStorage(currentProjectId, projectData);
            console.log('Draft guardado');
        }

        function publishProject() {
            const projectName = document.getElementById('projectName').value.trim();
            
            if (!projectName) {
                alert('Por favor, ingresa un nombre para el proyecto');
                return;
            }

            const projectData = getFormData();
            projectData.name = projectName;
            projectData.status = 'published';
            projectData.publishedAt = Date.now();

            if (!currentProjectId) {
                currentProjectId = Date.now().toString();
            }

            projectData.id = currentProjectId;
            projectData.createdAt = currentProjectId;
            projectData.updatedAt = Date.now();

            // Guardar proyecto
            saveProjectToStorage(currentProjectId, projectData);

            // Agregar al sidebar
            addTeamToSidebar(projectData);

            console.log('Proyecto publicado:', projectData);
            
            // Mostrar mensaje de éxito
            alert('Proyecto publicado exitosamente');
            
            // Limpiar formulario para nuevo proyecto
            clearForm();
        }

        function getFormData() {
            return {
                name: document.getElementById('projectName').value.trim(),
                teamCost: document.getElementById('teamCost').value,
                associatedProjects: document.getElementById('associatedProjects').value,
                members: [], // Se puede expandir más adelante
                searchQuery: document.getElementById('searchInput').value
            };
        }

        function saveProjectToStorage(projectId, projectData) {
            const projectDataObj = DocuProjectData.getProjectData() || { teams: [] };
            
            if (!projectDataObj.teams) {
                projectDataObj.teams = [];
            }

            // Buscar si ya existe
            const existingIndex = projectDataObj.teams.findIndex(t => t.id === projectId);
            
            if (existingIndex >= 0) {
                projectDataObj.teams[existingIndex] = projectData;
            } else {
                projectDataObj.teams.push(projectData);
            }

            DocuProjectData.saveProjectData(projectDataObj);
        }

        function clearForm() {
            document.getElementById('projectName').value = '';
            document.getElementById('teamCost').value = '';
            document.getElementById('associatedProjects').value = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('publishBtn').disabled = true;
            currentProjectId = null;
            currentProjectData = null;
        }

        // ============================================
        // Members Management
        // ============================================
        let membersList = [];
        
        function initMembersManagement() {
            console.log('initMembersManagement called');
            
            // Click en el botón "Add new member" del header
            const addMemberBtn = document.getElementById('addMemberBtn');
            console.log('addMemberBtn:', addMemberBtn);
            if (addMemberBtn) {
                addMemberBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Add member button clicked');
                    openAddMemberModal();
                });
            } else {
                console.error('Add member button not found!');
            }
            
            // Click en el profile-card-placeholder
            const addMemberCard = document.getElementById('addMemberCard');
            console.log('addMemberCard:', addMemberCard);
            if (addMemberCard) {
                // Asegurar que toda la card tenga zona activa
                // El CSS ya tiene cursor: pointer, pero agregamos funcionalidad adicional
                const allElements = addMemberCard.querySelectorAll('*');
                allElements.forEach(element => {
                    // Prevenir que los elementos hijos capturen el click
                    element.style.pointerEvents = 'none';
                });
                
                // Restaurar pointer-events en elementos realmente interactivos si los hay
                const interactiveElements = addMemberCard.querySelectorAll('a, button, input');
                interactiveElements.forEach(element => {
                    element.style.pointerEvents = 'auto';
                });
                
                // Hacer toda la card clickeable - capturar clicks en cualquier parte
                addMemberCard.addEventListener('click', function(e) {
                    console.log('Profile card placeholder clicked');
                    // Prevenir que otros elementos capturen el click
                    e.stopPropagation();
                    e.preventDefault();
                    
                    // Si el click fue en un elemento interactivo, no hacer nada aquí
                    if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') {
                        console.log('Click on interactive element, ignoring');
                        return;
                    }
                    
                    // Abrir modal para agregar miembro
                    openAddMemberModal();
                });
            } else {
                console.error('Profile card placeholder not found!');
            }
        }
        
        // ============================================
        // Modal Functionality
        // ============================================
        function openAddMemberModal() {
            console.log('openAddMemberModal called');
            const modalOverlay = document.getElementById('addMemberModalOverlay');
            console.log('modalOverlay:', modalOverlay);
            
            if (!modalOverlay) {
                console.error('Modal overlay not found!');
                // Try to find it again after a short delay
                setTimeout(function() {
                    const retryOverlay = document.getElementById('addMemberModalOverlay');
                    if (retryOverlay) {
                        retryOverlay.classList.add('active');
                        document.body.style.overflow = 'hidden';
                        resetModalForm();
                    } else {
                        console.error('Modal overlay still not found after retry!');
                    }
                }, 100);
                return;
            }
            
            // Force show modal
            modalOverlay.classList.add('active');
            modalOverlay.style.display = 'flex';
            modalOverlay.style.opacity = '1';
            modalOverlay.style.visibility = 'visible';
            document.body.style.overflow = 'hidden';
            
            // Reset form
            resetModalForm();
            console.log('Modal opened successfully');
        }
        
        // Make function globally accessible
        window.openAddMemberModal = openAddMemberModal;

        function closeModal() {
            const modalOverlay = document.getElementById('addMemberModalOverlay');
            if (modalOverlay) {
                modalOverlay.classList.remove('active');
                modalOverlay.style.display = 'none';
                modalOverlay.style.opacity = '0';
                modalOverlay.style.visibility = 'hidden';
                document.body.style.overflow = '';
                // Reset form when closing
                resetModalForm();
            }
        }
        
        // Make function globally accessible
        window.closeModal = closeModal;

        function resetModalForm() {
            // Clear all inputs
            document.getElementById('modalMemberName').value = '';
            document.getElementById('modalMemberLastName').value = '';
            document.getElementById('modalMemberJobPosition').value = '';
            document.getElementById('modalMemberEmail').value = '';
            document.getElementById('modalMemberPhone').value = '';
            document.getElementById('modalMemberCost').value = '';
            
            // Reset avatar preview
            const modalAvatarIcon = document.getElementById('modalAvatarIcon');
            const modalAvatarPreview = document.getElementById('modalAvatarPreview');
            const modalAvatarInput = document.getElementById('modalAvatarInput');
            
            if (modalAvatarIcon) modalAvatarIcon.style.display = 'block';
            if (modalAvatarPreview) {
                modalAvatarPreview.style.display = 'none';
                modalAvatarPreview.src = '';
            }
            if (modalAvatarInput) modalAvatarInput.value = '';
        }

        function initModalFunctionality() {
            console.log('initModalFunctionality called');
            const modalOverlay = document.getElementById('addMemberModalOverlay');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const modalAddBtn = document.getElementById('modalAddBtn');
            const modalAvatarInput = document.getElementById('modalAvatarInput');
            const modalAvatarIcon = document.getElementById('modalAvatarIcon');
            const modalAvatarPreview = document.getElementById('modalAvatarPreview');

            console.log('Modal elements:', {
                overlay: modalOverlay,
                closeBtn: modalCloseBtn,
                cancelBtn: modalCancelBtn,
                addBtn: modalAddBtn
            });

            // Close modal with X button
            if (modalCloseBtn) {
                modalCloseBtn.addEventListener('click', closeModal);
            } else {
                console.error('Modal close button not found');
            }

            // Close modal with Cancel button
            if (modalCancelBtn) {
                modalCancelBtn.addEventListener('click', closeModal);
            } else {
                console.error('Modal cancel button not found');
            }

            // Close modal when clicking overlay
            if (modalOverlay) {
                modalOverlay.addEventListener('click', function(e) {
                    if (e.target === modalOverlay) {
                        closeModal();
                    }
                });
            } else {
                console.error('Modal overlay not found!');
            }

            // Close modal with ESC key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay?.classList.contains('active')) {
                    closeModal();
                }
            });

            // Handle avatar upload
            if (modalAvatarInput) {
                modalAvatarInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const imageUrl = event.target.result;
                            if (modalAvatarIcon) modalAvatarIcon.style.display = 'none';
                            if (modalAvatarPreview) {
                                modalAvatarPreview.src = imageUrl;
                                modalAvatarPreview.style.display = 'block';
                            }
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            // Handle Add button
            if (modalAddBtn) {
                modalAddBtn.addEventListener('click', function() {
                    const memberData = {
                        id: Date.now().toString(),
                        name: document.getElementById('modalMemberName')?.value.trim() || '',
                        lastName: document.getElementById('modalMemberLastName')?.value.trim() || '',
                        jobPosition: document.getElementById('modalMemberJobPosition')?.value.trim() || '',
                        email: document.getElementById('modalMemberEmail')?.value.trim() || '',
                        phone: document.getElementById('modalMemberPhone')?.value.trim() || '',
                        cost: document.getElementById('modalMemberCost')?.value.trim() || '',
                        image: modalAvatarPreview?.src || ''
                    };

                    // Validation
                    if (!memberData.name || !memberData.lastName || !memberData.email) {
                        alert('Please fill in Name, Last name, and Email fields.');
                        return;
                    }

                    // Create member
                    createMember(memberData);

                    // Close modal
                    closeModal();
                });
            }
        }
        
        function createMember(memberData) {
            membersList.push(memberData);
            
            // Habilitar secondary-actions cuando se crea el primer miembro
            if (membersList.length === 1) {
                enableSecondaryActions();
            }
            
            // Crear tarjeta de miembro visual
            createMemberCard(memberData);
            
            console.log('Miembro creado:', memberData);
            console.log('Total de miembros:', membersList.length);
        }

        function createMemberCard(memberData) {
            const teamMembersGrid = document.getElementById('teamMembersGrid');
            if (!teamMembersGrid) return;

            // Crear elemento de tarjeta usando la estructura correcta del componente dsu-profile-card
            const memberCard = document.createElement('div');
            memberCard.className = 'dsu-profile-card';
            memberCard.dataset.memberId = memberData.id;
            
            // Construir HTML de la tarjeta según la estructura del design system
            const imageSrc = memberData.image || 'images/avatar_icon.svg';
            const imageAlt = memberData.image ? `${escapeHtml(memberData.name)} ${escapeHtml(memberData.lastName || '')}` : 'Avatar';
            const imageClass = memberData.image ? 'dsu-profile-card__image' : 'dsu-profile-card__image';
            
            memberCard.innerHTML = `
                <div class="dsu-profile-card__image-wrapper">
                    <img src="${escapeHtml(imageSrc)}" alt="${escapeHtml(imageAlt)}" class="${imageClass}">
                    <button class="dsu-profile-card__edit-button">
                        <img src="images/Edit.svg" alt="Edit" class="dsu-profile-card__edit-icon">
                    </button>
                </div>
                <div class="dsu-profile-card__content">
                    <div class="dsu-profile-card__name-job">
                        <p class="dsu-profile-card__name">${escapeHtml(memberData.name)} ${escapeHtml(memberData.lastName || '')}</p>
                        <p class="dsu-profile-card__job">${escapeHtml(memberData.jobPosition || 'Job position')}</p>
                    </div>
                    <div class="dsu-profile-card__contact">
                        ${memberData.email ? `<div class="dsu-profile-card__contact-item">
                            <img src="images/mail.svg" alt="Email" class="dsu-profile-card__contact-icon">
                            <a href="mailto:${escapeHtml(memberData.email)}" class="dsu-profile-card__contact-text dsu-profile-card__contact-link">${escapeHtml(memberData.email)}</a>
                        </div>` : ''}
                        ${memberData.phone ? `<div class="dsu-profile-card__contact-item">
                            <img src="images/whatsapp.svg" alt="Phone" class="dsu-profile-card__contact-icon">
                            <p class="dsu-profile-card__contact-text">${escapeHtml(memberData.phone)}</p>
                        </div>` : ''}
                    </div>
                </div>
            `;

            // Insertar antes del placeholder card (addMemberCard)
            const addMemberCard = document.getElementById('addMemberCard');
            if (addMemberCard) {
                teamMembersGrid.insertBefore(memberCard, addMemberCard);
            } else {
                teamMembersGrid.appendChild(memberCard);
            }
        }
        
        function disableSecondaryActions() {
            const secondaryActions = document.querySelector('.secondary-actions');
            if (secondaryActions) {
                secondaryActions.classList.add('disabled');
            }
        }
        
        function enableSecondaryActions() {
            const secondaryActions = document.querySelector('.secondary-actions');
            if (secondaryActions) {
                secondaryActions.classList.remove('disabled');
            }
        }
        
        function checkAndUpdateSecondaryActions() {
            // Verificar si hay miembros creados
            const hasMembers = membersList.length > 0;
            
            if (hasMembers) {
                enableSecondaryActions();
            } else {
                disableSecondaryActions();
            }
        }

        // ============================================
        // Associated Projects Chips Functionality
        // ============================================
        function initAssociatedProjectsChips() {
            const associatedProjectsInput = document.getElementById('associatedProjects');
            const chipsContainer = document.getElementById('projectsChipsContainer');
            
            if (!associatedProjectsInput || !chipsContainer) return;
            
            // Crear chip al presionar Enter
            associatedProjectsInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = this.value.trim();
                    
                    if (value) {
                        // Verificar si el chip ya existe
                        const existingChips = Array.from(chipsContainer.querySelectorAll('.project-chip'));
                        const exists = existingChips.some(chip => 
                            chip.querySelector('.project-chip__text').textContent.toLowerCase() === value.toLowerCase()
                        );
                        
                        if (!exists) {
                            const chip = createProjectChip(value);
                            chipsContainer.appendChild(chip);
                            this.value = ''; // Limpiar input después de crear chip
                        } else {
                            alert('Este proyecto ya está agregado');
                        }
                    }
                }
            });
        }
        
        function createProjectChip(text) {
            const chip = document.createElement('div');
            chip.className = 'project-chip';
            chip.setAttribute('data-project', text.trim());
            
            const chipText = document.createElement('span');
            chipText.className = 'project-chip__text';
            chipText.textContent = text.trim();
            
            const closeBtn = document.createElement('button');
            closeBtn.className = 'project-chip__close';
            closeBtn.setAttribute('aria-label', 'Remove project');
            closeBtn.innerHTML = '<svg class="project-chip__close-icon" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 3L3 9M3 3L9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            
            closeBtn.addEventListener('click', function() {
                chip.remove();
            });
            
            chip.appendChild(chipText);
            chip.appendChild(closeBtn);
            
            return chip;
        }

        // ============================================
        // Input Buscador Functionality
        // ============================================
        function initInputBuscador() {
            const searchInput = document.getElementById('searchInput');
            const sendIcon = document.getElementById('searchSendIcon');
            
            if (!searchInput || !sendIcon) return;
            
            // Activar/desactivar icono según input
            searchInput.addEventListener('input', function() {
                if (this.value.trim().length > 0) {
                    sendIcon.classList.add('dsu-input-buscador__send-icon--active');
                } else {
                    sendIcon.classList.remove('dsu-input-buscador__send-icon--active');
                }
            });
            
            // Handler para el click en el icono
            sendIcon.addEventListener('click', function() {
                const searchValue = searchInput.value.trim();
                if (searchValue) {
                    console.log('Enviar búsqueda:', searchValue);
                    // Aquí puedes agregar la lógica de búsqueda
                    performSearch(searchValue);
                }
            });
            
            // También permitir búsqueda con Enter
            searchInput.addEventListener('keypress', function(e) {

        // ============================================
        // Load Teams in Sidebar
        // ============================================
        function loadTeamsInSidebar() {
            const teamsList = document.getElementById('teamsList');
            if (!teamsList) return;

            const projectData = DocuProjectData.getProjectData();
            const teams = (projectData && projectData.teams) ? projectData.teams : [];

            // Filtrar solo equipos publicados y ordenar por fecha (más reciente primero)
            const publishedTeams = teams
                .filter(team => team.status === 'published')
                .sort((a, b) => (b.publishedAt || b.createdAt || 0) - (a.publishedAt || a.createdAt || 0));

            // Limpiar lista
            teamsList.innerHTML = '';

            // Agregar equipos a la lista
            publishedTeams.forEach(team => {
                const teamItem = document.createElement('button');
                teamItem.className = 'dsu-team-item';
                teamItem.innerHTML = `<span class="dsu-team-item__text">${escapeHtml(team.name || 'Sin nombre')}</span>`;
                teamItem.addEventListener('click', function() {
                    loadProjectData(team.id);
                });
                teamsList.appendChild(teamItem);
            });
        }
